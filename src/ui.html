<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viherd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..650&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Tokens — gris resserrés façon Linear, une seule couleur d'accent
   ===================================================================== */
:root {
  --app: #08090a; --panel: #0f1011; --raise: #151618; --hover: #1a1b1e; --press: #212226;
  --line: #1e1f23; --line-2: #2a2b30; --line-3: #3a3b41;
  --t1: #f7f8f8; --t2: #b4b6bc; --t3: #8a8f98; --t4: #62666d;
  --accent: #7c7ff5; --accent-soft: rgba(124,127,245,.16);
  --green: #4cb782; --amber: #f2c94c; --red: #eb5757; --blue: #4ea7fc; --php: #8993be; --node: #5fa04e;
  --shadow: 0 0 0 1px var(--line-2), 0 8px 24px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --app: #f4f4f5; --panel: #ffffff; --raise: #fbfbfb; --hover: #f2f2f4; --press: #e9e9ec;
  --line: #ececee; --line-2: #e1e1e4; --line-3: #cfcfd4;
  --t1: #18181b; --t2: #3f3f46; --t3: #6b6b74; --t4: #a0a0a8;
  --accent: #5e6ad2; --accent-soft: rgba(94,106,210,.12);
  --green: #2e9e66; --amber: #d29b00; --red: #d64545; --blue: #2f7fd8; --php: #6c78b0; --node: #46883a;
  --shadow: 0 0 0 1px var(--line-2), 0 8px 24px rgba(20,20,30,.12), 0 2px 6px rgba(20,20,30,.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--app); color: var(--t1); font: 400 13px/1.45 var(--font); font-feature-settings: "cv11", "ss01", "calt"; -webkit-font-smoothing: antialiased; overflow: hidden; letter-spacing: -.003em; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--line-3); border: 3px solid transparent; background-clip: padding-box; }
::selection { background: var(--accent-soft); }
kbd { font: 500 11px var(--mono); color: var(--t3); background: var(--raise); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; min-width: 18px; display: inline-block; text-align: center; }
svg.i { width: 16px; height: 16px; flex: none; }

/* =====================================================================
   Coquille : barre latérale à plat + panneau surélevé
   ===================================================================== */
.app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
.side { display: flex; flex-direction: column; padding: 10px 10px 10px 12px; gap: 1px; min-height: 0; }
.ws { display: flex; align-items: center; gap: 4px; padding: 2px 0 12px; }
.ws-btn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; flex: 1; min-width: 0; }
.ws-btn:hover { background: var(--hover); }
.ws-logo { width: 20px; height: 20px; border-radius: 5px; background: linear-gradient(140deg, #8b8ef8, #5b5fd8); display: grid; place-items: center; color: #fff; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.ws-logo svg { width: 11px; height: 11px; }
.ws-btn b { font-weight: 550; letter-spacing: -.01em; }
.ws-btn .chev { color: var(--t4); }
.ib { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--t3); flex: none; }
.ib:hover { background: var(--hover); color: var(--t1); }
.ib svg { width: 16px; height: 16px; }
.ib.boxed { box-shadow: inset 0 0 0 1px var(--line-2); background: var(--raise); }
.nv { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--t2); font-weight: 450; white-space: nowrap; }
.nv:hover { background: var(--hover); color: var(--t1); }
.nv.on { background: var(--press); color: var(--t1); }
.nv svg { width: 16px; height: 16px; color: var(--t3); }
.nv.on svg { color: var(--t1); }
.nv .n { margin-left: auto; color: var(--t4); font-size: 12px; font-feature-settings: "tnum"; }
.nv .glyph { width: 14px; height: 14px; }
.sec { all: unset; cursor: pointer; display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; margin-top: 14px; color: var(--t4); font-size: 12px; font-weight: 500; border-radius: 6px; }
.sec:hover { color: var(--t2); }
.sec svg { width: 10px; height: 10px; transition: transform .15s; }
.sec.closed svg { transform: rotate(-90deg); }
.grp.closed { display: none; }
.favs { overflow: auto; min-height: 0; }
#nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: none; }
#nav > * { flex: none; } #nav > .favs { flex: 0 1 auto; }
.side-foot { flex: none; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }
.me { all: unset; cursor: pointer; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; transition: background .12s; }
.me:hover, .me.open { background: var(--hover); }
.me-logo { position: relative; width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(140deg, #8b8ef8, #5b5fd8); display: grid; place-items: center; color: #fff; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 1px 2px rgba(0,0,0,.3); }
.me-logo svg { width: 14px; height: 14px; }
.me-logo i { position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2.5px var(--side, var(--app)); }
.me-logo i.off { background: var(--red); }
.me-t { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
.me-t b { font-size: 13px; font-weight: 600; color: var(--t1); letter-spacing: -.01em; }
.me-t span { font-size: 11.5px; color: var(--t4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-t span.off { color: var(--red); }
.me > svg { width: 14px; height: 14px; color: var(--t4); flex: none; }

.panel { margin: 8px 8px 8px 0; background: var(--panel); border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.2); display: grid; grid-template-rows: 46px 1fr; min-width: 0; overflow: hidden; }
.top { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line); min-width: 0; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--t3); min-width: 0; white-space: nowrap; }
.crumb a:hover { color: var(--t1); }
.crumb b { color: var(--t1); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.crumb svg { width: 12px; height: 12px; color: var(--t4); }
.top .sp { flex: 1; }
.pager { display: flex; align-items: center; gap: 2px; color: var(--t3); font-size: 12px; font-feature-settings: "tnum"; margin-right: 4px; }
.body { overflow: auto; min-height: 0; }

/* =====================================================================
   Contrôles
   ===================================================================== */
.btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; font-weight: 500; white-space: nowrap; color: var(--t1); background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 1px rgba(0,0,0,.15); transition: background .1s; }
.btn:hover { background: var(--hover); }
.btn svg { width: 14px; height: 14px; color: var(--t3); }
.btn.pri { background: var(--accent); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.25); }
.btn.pri svg { color: rgba(255,255,255,.85); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.flat { background: transparent; box-shadow: none; color: var(--t2); }
.btn.flat:hover { background: var(--hover); color: var(--t1); }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .5; cursor: progress; }
.input { height: 28px; padding: 0 9px; border-radius: 6px; border: 0; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); outline: none; min-width: 0; }
.input:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--t4); }
.find { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--raise); color: var(--t4); width: 220px; }
.find:focus-within { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft); }
.find svg { width: 14px; height: 14px; }
.find input { all: unset; flex: 1; color: var(--t1); min-width: 0; }
.find input::placeholder { color: var(--t4); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--t2); font-size: 12px; white-space: nowrap; font-weight: 450; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: block; }
button.chip { border: 0; background: transparent; font-family: inherit; }
button.chip.mono { font-family: var(--mono); }
.chip.btnlike { cursor: pointer; } .chip.btnlike:hover { background: var(--hover); color: var(--t1); }
.tabs { display: flex; gap: 4px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
.pill { all: unset; cursor: pointer; height: 26px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; color: var(--t3); font-weight: 500; box-shadow: inset 0 0 0 1px transparent; }
.pill:hover { color: var(--t1); background: var(--hover); }
.pill.on { color: var(--t1); background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
.pill .n { color: var(--t4); font-feature-settings: "tnum"; }
.sw { position: relative; width: 28px; height: 16px; flex: none; }
.sw input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--press); box-shadow: inset 0 0 0 1px var(--line-2); cursor: pointer; transition: background .15s; }
.sw span::before { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--t3); transition: transform .15s, background .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.sw input:checked + span { background: var(--accent); box-shadow: none; }
.sw input:checked + span::before { transform: translateX(12px); background: #fff; }
.sw input:disabled + span { opacity: .5; }

/* =====================================================================
   Listes façon Linear
   ===================================================================== */
.group-h { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 20px; background: var(--raise); border-bottom: 1px solid var(--line); color: var(--t2); font-weight: 500; position: sticky; top: 0; z-index: 1; }
.group-h .n { color: var(--t4); font-weight: 400; }
.li { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 20px; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
.li:hover, .li.kb { background: var(--hover); }
.li .glyph { flex: none; }
.li .nm { font-weight: 500; white-space: nowrap; }
.li .sub { color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.li .gap { flex: 1; min-width: 12px; }
.li .meta { display: flex; align-items: center; gap: 6px; flex: none; }
.li .when { color: var(--t3); font-size: 12px; width: 76px; text-align: right; flex: none; font-feature-settings: "tnum"; }
.li .go { opacity: 0; color: var(--t3); } .li:hover .go { opacity: 1; }
.empty { display: grid; place-items: center; text-align: center; gap: 4px; padding: 80px 20px; color: var(--t3); }
.empty .art { width: 44px; height: 44px; margin-bottom: 10px; border-radius: 10px; display: grid; place-items: center; color: var(--t3); background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
.empty .art svg { width: 20px; height: 20px; }
.empty b { color: var(--t1); font-weight: 500; font-size: 14px; }
.empty .btn { margin-top: 14px; }

/* =====================================================================
   Page détail : colonne principale + propriétés
   ===================================================================== */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 100%; }
.detail .main-col { max-width: none; }
.main-col { padding: 28px 36px 48px; max-width: 980px; width: 100%; }
/* pages pleine largeur : contenu principal + colonne latérale */
.wide { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; padding: 24px 28px 40px; align-items: start; }
.wide.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.wide > * { min-width: 0; }
.wide h3.h:first-child, .colside h3.h:first-child { margin-top: 0; }
.colside { display: grid; gap: 0; align-content: start; }
.mini .r { min-height: 36px; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 18px; width: 64px; flex: none; }
.spark i { flex: 1; background: var(--accent); opacity: .55; border-radius: 1px; min-height: 1px; }
.spark i.z { background: var(--line-2); opacity: 1; }
.li .path { color: var(--t4); font: 11.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 340px; flex: 0 100 auto; }
.li .sub { flex-shrink: 0; }
.li .req { color: var(--t3); font-size: 12px; width: 60px; text-align: right; flex: none; font-feature-settings: "tnum"; }
@media (max-width: 1200px) { .wide { grid-template-columns: 1fr; } .li .path { display: none; } }
.props { border-left: 1px solid var(--line); padding: 18px 16px; display: grid; align-content: start; gap: 2px; background: color-mix(in srgb, var(--panel) 60%, var(--app)); }
.props h4 { margin: 18px 6px 6px; font-size: 12px; font-weight: 500; color: var(--t4); }
.props h4:first-child { margin-top: 0; }
.prop { display: grid; grid-template-columns: 92px 1fr; align-items: center; min-height: 32px; gap: 8px; }
.prop .k { color: var(--t3); padding-left: 6px; }
.pv { all: unset; display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 6px; border-radius: 6px; min-width: 0; overflow: hidden; }
button.pv { cursor: pointer; } button.pv:hover { background: var(--hover); }
.pv .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv .muted { color: var(--t4); }
.title { font-size: 24px; font-weight: 600; letter-spacing: -.022em; margin: 0; line-height: 1.25; display: flex; align-items: center; gap: 12px; }
.lede { color: var(--t3); margin: 8px 0 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.lede a { color: var(--t2); } .lede a:hover { color: var(--t1); text-decoration: underline; text-underline-offset: 3px; }
h3.h { font-size: 13px; font-weight: 600; margin: 36px 0 10px; display: flex; align-items: center; gap: 8px; letter-spacing: -.005em; }
h3.h .n { color: var(--t4); font-weight: 400; }
h3.h .sp { flex: 1; }
.card { border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--raise); overflow: hidden; }
.card .r { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 12px; border-top: 1px solid var(--line); }
.card .r:first-child { border-top: 0; }
.card .r .grow { flex: 1; min-width: 0; }
.card .r .dim { color: var(--t3); }
.feed { display: grid; }
.ev { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: start; padding: 7px 0; color: var(--t3); position: relative; }
.ev::before { content: ""; position: absolute; left: 9.5px; top: 26px; bottom: -6px; width: 1px; background: var(--line-2); }
.ev:last-child::before { display: none; }
.ev .ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--t3); z-index: 1; }
.ev .ico svg { width: 11px; height: 11px; }
.ev .ico.ok { color: var(--green); } .ev .ico.err { color: var(--red); } .ev .ico.acc { color: var(--accent); } .ev .ico.amber { color: var(--amber); }
.ev b { color: var(--t1); font-weight: 500; }
.ev time { font-size: 12px; color: var(--t4); white-space: nowrap; font-feature-settings: "tnum"; }
pre.term { margin: 0; padding: 12px 14px; font: 12px/1.65 var(--mono); color: var(--t2); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; background: var(--app); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
pre.term.tall { max-height: none; height: 100%; border-radius: 0; box-shadow: none; }
pre.term .e { color: var(--red); } pre.term .w { color: var(--amber); } pre.term .ts { color: var(--t4); }
.code { margin: 0; padding: 12px 14px; font: 12px/1.7 var(--mono); color: var(--t2); white-space: pre; overflow: auto; background: var(--app); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
.code i { font-style: normal; color: var(--t4); }
.code b { font-weight: 400; color: var(--accent); }

/* stats en ligne (Activité) */
.strip { display: flex; gap: 0; margin: 0 0 8px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--raise); overflow: hidden; }
.strip > div { flex: 1; padding: 14px 16px; border-left: 1px solid var(--line); cursor: pointer; }
.strip > div:first-child { border-left: 0; }
.strip > div:hover { background: var(--hover); }
.strip .k { color: var(--t3); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.strip .v { font-size: 22px; font-weight: 600; letter-spacing: -.03em; margin-top: 2px; font-feature-settings: "tnum"; }
.strip .v small { color: var(--t4); font-size: 13px; font-weight: 400; letter-spacing: 0; margin-left: 3px; }
.hello { font-size: 24px; font-weight: 600; letter-spacing: -.022em; margin: 0 0 4px; }

/* split (Mail, Logs) */
.split { display: grid; grid-template-columns: 340px 1fr; height: 100%; min-height: 0; }
.split > .l { border-right: 1px solid var(--line); overflow: auto; min-height: 0; }
.split > .r { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.mi { display: grid; gap: 2px; padding: 12px 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mi:hover { background: var(--hover); } .mi.on { background: var(--press); }
.mi .a { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mi .a b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi .a time { color: var(--t4); font-size: 12px; flex: none; }
.mi .s { color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.mhead { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.mhead h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
.mhead .who { display: flex; align-items: center; gap: 10px; color: var(--t3); }
.mhead .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12px; color: #fff; background: linear-gradient(140deg, #8b8ef8, #5b5fd8); flex: none; }
.mhead .who b { color: var(--t1); font-weight: 500; }
.mhead .row { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 7px; background: var(--app); box-shadow: inset 0 0 0 1px var(--line-2); }
.seg button { all: unset; cursor: pointer; height: 22px; padding: 0 9px; border-radius: 5px; color: var(--t3); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; }
.seg button:hover { color: var(--t1); }
.seg button.on { background: var(--raise); color: var(--t1); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0,0,0,.2); }
.seg button:disabled { opacity: .35; cursor: default; }
.mbody { min-height: 0; overflow: auto; }
.mbody iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
.mbody pre { margin: 0; padding: 20px 28px; font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--t2); }

/* =====================================================================
   Popovers, dialogue, palette, toasts
   ===================================================================== */
.pop { position: fixed; z-index: 60; min-width: 220px; max-width: 320px; background: var(--raise); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; animation: pop .12s ease-out; }
:root[data-theme="dark"] .pop { background: #1c1d20; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.pop input { all: unset; display: block; box-sizing: border-box; width: 100%; padding: 8px 8px 9px; margin-bottom: 4px; border-bottom: 1px solid var(--line-2); color: var(--t1); }
.pop input::placeholder { color: var(--t4); }
.pop .o { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 5px; cursor: pointer; color: var(--t2); white-space: nowrap; }

.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 70; }
.toast { display: flex; align-items: center; gap: 10px; min-width: 280px; max-width: 420px; padding: 10px 12px; border-radius: 8px; background: var(--raise); box-shadow: var(--shadow); animation: pop .14s ease-out; }

/* =====================================================================
   Couleur & hiérarchie (v3)
   ===================================================================== */
:root { --t3: #959aa3; }
:root[data-theme="light"] { --t3: #64646d; }
.panel { background: radial-gradient(1200px 380px at 0% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%), var(--panel); }
.av { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; flex: none; color: #fff; font: 650 10px/1 var(--font); text-transform: uppercase; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), 0 1px 2px rgba(0,0,0,.25); text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.nv .av { width: 16px; height: 16px; font-size: 9px; border-radius: 4px; }

.s-ok { background: var(--green); } .s-live { background: var(--amber); } .s-err { background: var(--red); }
.brand { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; flex: none; }

.st { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px 0 6px; border-radius: 99px; font-size: 11.5px; font-weight: 500; color: var(--t2); background: var(--press); white-space: nowrap; }

.page-pad { padding: 22px 28px 48px; max-width: 1240px; }

.top-r { display: flex; align-items: center; gap: 6px; min-width: 0; }

button.chip svg.i { width: 12px; height: 12px; color: var(--t4); margin-left: 2px; }

/* services : grille de cartes */

.svc { display: flex; flex-direction: column; border-radius: 12px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); transition: box-shadow .15s, transform .15s; min-width: 0; }

/* panneau latéral (service) */
.sheet { position: fixed; top: 8px; right: 8px; bottom: 8px; width: min(560px, calc(100vw - 16px)); z-index: 52; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto auto 1fr; transform: translateX(calc(100% + 24px)); transition: transform .24s cubic-bezier(.2, .8, .2, 1); }

.sheet.open { transform: none; }
.sheet .sh { display: flex; gap: 12px; align-items: center; padding: 16px 12px 12px 16px; }
.sheet .sb { overflow: auto; padding: 12px 16px 16px; min-height: 0; display: flex; flex-direction: column; }
.sheet .sb pre.term.tall { flex: 1; min-height: 240px; }

/* activité : bandeau d'état + fil compact */
.act { grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; }
.health { border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.health.ok { background: color-mix(in srgb, var(--green) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--green) 22%, transparent); }
.health.bad { display: block; padding: 0; background: color-mix(in srgb, var(--red) 6%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red) 25%, transparent); }
.health .hh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid color-mix(in srgb, var(--red) 18%, transparent); }

.health .dim { color: var(--t3); }
.day { font-size: 12px; font-weight: 500; color: var(--t4); margin: 22px 0 4px; text-transform: capitalize; }
.ev { padding: 5px 0; grid-template-columns: 20px 1fr auto; font-size: 13px; }

.svc-dots { display: flex; flex-wrap: wrap; gap: 6px; }

.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.quick button { all: unset; cursor: pointer; display: grid; gap: 4px; padding: 14px; border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }

   Responsive
   ===================================================================== */

/* workers & queues */

.wk-txt .mono { font-size: 11px; color: var(--t4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-st { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--t3); white-space: nowrap; flex: none; }

.wk-h { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.wk-title { flex: 1; min-width: 200px; }
.wk-kind { font-size: 12px; color: var(--t3); }
.wk-title h1 { margin: 2px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wk-sitelink { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--t2); padding: 2px 8px 2px 4px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--line-2); letter-spacing: 0; }
.wk-sitelink:hover { color: var(--t1); background: var(--hover); }

.wk-acts { display: flex; gap: 6px; }

.wk-stats span { font-size: 11.5px; color: var(--t3); } .wk-stats b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-feature-settings: "tnum"; }

.wk-cmd svg { width: 14px; height: 14px; color: var(--t4); } .wk-cmd:hover svg { color: var(--t1); }
.wk-queue { display: grid; gap: 10px; padding: 14px; border-radius: 10px; background: var(--raise); box-shadow: inset 0 0 0 1px var(--line-2); }
.wk-q-h, .wk-fail-h { display: flex; align-items: center; gap: 8px; } .wk-q-h .dim { font-size: 11.5px; color: var(--t4); }

.attn { border-radius: 12px; overflow: hidden; background: color-mix(in srgb, var(--red) 6%, var(--raise)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red) 28%, transparent); }

}

.jr-row:hover { background: var(--hover); } .jr-row.open { background: var(--press); }

#bklabel { min-width: 200px; }

.note-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--amber); margin-bottom: 8px; }

.grid-wrap { overflow: auto; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--raise); flex: 1; min-height: 120px; }

@media (max-width: 900px) { .dbx { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .dbside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 36vh; } }
/* explorateur de bases v2 */
.dbx { grid-template-columns: 264px minmax(0, 1fr); }
.dbside { padding: 12px 10px; gap: 6px; }

function recentRows(ev) {

    if (p && !e.wk && p.html === e.html) { p.n++; continue; }
    rows.push({ ...e, n: 1 });
  }
  return rows.map(e => {
    if (e.wk && e.n > 1) { const [site, name] = e.wk.split(':'); e.html = `<b>${esc(site)} · ${esc(name)}</b> a planté ${e.n} fois`; e.ico = 'restart'; }
    const click = e.site ? `go('sites',${J(e.site)})` : e.go ? `go(${e.go.map(x => J(x)).join(',')})` : '';

}

  const base = all.filter(e => e.t >= since && (!JR.quiet || !e.routine || e.lvl !== 'info') && (!JR.src || evSource(e).k === JR.src) && (!q || (e.raw + ' ' + e.html.replace(/<[^>]+>/g, '')).toLowerCase().includes(q)));

let LIST = [], siteView = 'grid', siteSort = 'recent';
try { siteView = localStorage.getItem('sitesView') || 'grid'; siteSort = localStorage.getItem('sitesSort') || 'recent'; } catch {}
const SITE_FILTERS = [['all', 'Tous', () => true], ['active', 'Actifs', s => siteState(s) !== 'idle'], ['laravel', 'Laravel', s => s.laravel], ['workers', 'Avec workers', s => s.workers.length], ['node', 'Node', s => s.proxy]];
const SITE_SORTS = { recent: ['Activité récente', (a, b) => (b.metrics.last_at || 0) - (a.metrics.last_at || 0) || a.name.localeCompare(b.name)], name: ['Nom', (a, b) => a.name.localeCompare(b.name)], requests: ['Requêtes', (a, b) => b.metrics.requests - a.metrics.requests || a.name.localeCompare(b.name)] };

function pSites() {
  setTop(`<b>Sites</b>`);
  const counts = Object.fromEntries(SITE_FILTERS.map(([k, , f]) => [k, S.sites.filter(f).length]));
  $('body').innerHTML = `<div class="sp">
    <div class="sp-head">
      <div><h1>Sites</h1><p>${S.sites.length} site${S.sites.length > 1 ? 's' : ''} servi${S.sites.length > 1 ? 's' : ''} sur <span class="mono">*.${esc(S.tld)}${S.http_port === 80 ? '' : ':' + S.http_port}</span></p></div>
      <div class="sp-acts">
        <button class="btn" onclick="parkedMenu(this)">${ic('folder')}<span class="tl">Dossiers</span>${S.parked.length ? `<span class="dim">${S.parked.length}</span>` : ''}</button>
        <div class="btn-split"><button class="btn pri" onclick="dlgNew()">${ic('plus')}Nouveau projet</button><button class="btn pri" onclick="addSiteMenu(this)" title="Autres façons d'ajouter">${ic('down')}</button></div>
      </div>
    </div>
    ${S.sites.length ? `<div class="sp-bar">
      <label class="find sp-search">${ic('search')}<input id="q" placeholder="Rechercher un site ou un dossier…" value="${esc(q)}" oninput="q=this.value.toLowerCase();kb=-1;listOnly()"><kbd>/</kbd></label>
      <div class="seg sp-filters">${SITE_FILTERS.filter(([k]) => k === 'all' || counts[k]).map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" onclick="filter='${k}';kb=-1;pSites()">${l}<span class="c">${counts[k]}</span></button>`).join('')}</div>
      <button class="btn flat" onclick="siteSortMenu(this)">${ic('logs')}<span class="tl">${SITE_SORTS[siteSort][0]}</span></button>
      <div class="seg" title="Affichage">
        <button class="${siteView === 'grid' ? 'on' : ''}" onclick="setSiteView('grid')" title="Grille">${ic('grid')}</button>
        <button class="${siteView === 'list' ? 'on' : ''}" onclick="setSiteView('list')" title="Liste">${ic('rows')}</button></div>
    </div>` : ''}
    <div id="list"></div>
  </div>`;
  const qi = $('q'); if (qi) qi.onkeydown = e => { if (e.key === 'Escape') { qi.value = ''; q = ''; listOnly(); qi.blur(); } if (e.key === 'ArrowDown') { qi.blur(); kb = 0; listOnly(); } };
  listOnly();
}
function setSiteView(v) { siteView = v; try { localStorage.setItem('sitesView', v); } catch {} pSites(); }
function siteSortMenu(a) {
  popover(a, { width: 210, items: [{ label: 'Trier par' }, ...Object.entries(SITE_SORTS).map(([k, [l]]) => ({ text: l, checked: siteSort === k, run: () => { siteSort = k; try { localStorage.setItem('sitesSort', k); } catch {} pSites(); } }))] });
}
function addSiteMenu(a) {
  popover(a, { width: 260, items: [
    { text: 'Nouveau projet…', icon: ic('sparkle'), hint: 'N', run: dlgNew },
    { text: 'Parquer un dossier…', icon: ic('folder'), hint: 'A', run: dlgPark },
    { text: 'Lier un projet existant…', icon: ic('link'), run: dlgLink },
  ] });
}
function parkedMenu(a) {
  popover(a, { width: 380, items: [
    { label: S.parked.length ? 'Dossiers parqués · chaque sous-dossier est un site' : 'Aucun dossier parqué' },
    ...S.parked.map(p => ({ text: p, html: `<span class="mono" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:250px;display:block">${esc(p)}</span>`, icon: ic('folder'), hint: 'retirer',
      run: () => { if (confirm(`Ne plus servir les sites de ${p} ?\n(Le dossier n'est pas supprimé.)`)) act('/api/unpark', { path: p }, 'Dossier retiré'); } })),
    { sep: 1 },
    { text: 'Parquer un dossier…', icon: ic('plus'), run: dlgPark },
    { text: 'Lier un projet existant…', icon: ic('link'), run: dlgLink },
  ] });
}

function listOnly() {
  const box = $('list'); if (!box) return;
  if (!S.sites.length) {
    box.innerHTML = `<div class="first" style="margin-top:8px">
      <button onclick="dlgNew()"><span class="brand" style="${tint('#f9322c')}">${ic('sparkle')}</span><b>Créer un projet</b><span>Laravel ou PHP, avec ses propres versions de PHP et Node.</span></button>
      <button onclick="dlgPark()"><span class="brand" style="${tint('#7c7ff5')}">${ic('folder')}</span><b>Parquer un dossier</b><span>Chaque sous-dossier devient un site .${esc(S.tld)}.</span></button>
      <button onclick="dlgLink()"><span class="brand" style="${tint('#4cb782')}">${ic('link')}</span><b>Lier un projet</b><span>Sers un dossier précis sans le déplacer.</span></button></div>`;
    return;
  }
  const f = (SITE_FILTERS.find(([k]) => k === filter) || SITE_FILTERS[0])[2];
  LIST = S.sites.filter(s => f(s) && (!q || (s.name + ' ' + s.path).toLowerCase().includes(q))).sort(SITE_SORTS[siteSort][1]);
  if (!LIST.length) { box.innerHTML = `<div class="empty"><div class="art">${ic('search')}</div><b>Aucun site trouvé</b><span>${q ? `Rien ne correspond à « ${esc(q)} ».` : 'Aucun site dans ce filtre.'}</span><button class="btn" onclick="q='';filter='all';pSites()">Tout afficher</button></div>`; return; }
  if (kb >= LIST.length) kb = LIST.length - 1;
  if (siteView === 'grid') {
    box.innerHTML = `<div class="pgrid">${LIST.map((s, i) => projCard(s).replace('class="pcard"', `class="pcard ${kb === i ? 'kb' : ''}" data-i="${i}"`)).join('')}</div>`;
  } else {
    box.innerHTML = `<div class="stable">
      <div class="st-h"><span>Site</span><span>État</span><span class="hide-md">Runtime</span><span class="hide-md">Workers</span><span class="hide-sm">Trafic · 4 min</span><span>Dernière requête</span><span></span></div>
      ${LIST.map((s, i) => siteRow(s, i)).join('')}</div>`;
  }
  document.querySelector('#list .kb')?.scrollIntoView({ block: 'nearest' });
}
function siteRow(s, i) {
  const st = siteState(s), w = s.workers;
  return `<div class="st-r ${kb === i ? 'kb' : ''}" data-i="${i}" onclick="go('sites',${J(s.name)})" ondblclick="window.open(${J(s.url)})">
    <span class="st-site">${avatar(s.name)}<span class="nm"><b>${esc(s.name)}</b><span class="mono">${esc(s.url.replace('http://', ''))}</span></span>${s.laravel ? '<i class="lara" title="Laravel"></i>' : ''}</span>
    <span><span class="st st-${st === 'idle' ? 'off' : st === 'live' ? 'live' : st}">${glyph(st, 10)}${STATE_L[st]}</span></span>
    <span class="hide-md st-rt">${s.proxy ? chip('var(--blue)', `proxy :${s.proxy}`) : chip('var(--php)', 'PHP ' + esc(s.php))}${chip('var(--node)', 'Node ' + esc(s.node))}</span>
    <span class="hide-md">${w.length ? `<span class="${w.some(jobBad) ? 'red' : ''}">${glyph(w.some(jobBad) ? 'err' : w.every(x => x.running) ? 'ok' : 'off', 10)} ${w.filter(x => x.running).length}/${w.length}</span>` : '<span class="dim">—</span>'}</span>
    <span class="hide-sm">${spark(s)}</span>
    <span class="dim">${s.metrics.last_at ? ago(s.metrics.last_at) : '—'}</span>
    <a class="ib st-open" href="${esc(s.url)}" target="_blank" onclick="event.stopPropagation()" title="Ouvrir le site">${ic('ext')}</a></div>`;
}

/* =====================================================================
   Page d'un site : onglets + colonne de propriétés
   ===================================================================== */
const normPath = p => (p || '').replace(/\//g, '\\').replace(/\\+$/, '').toLowerCase();
const siteOfPath = p => { const n = normPath(p); return S.sites.find(s => n === normPath(s.path) || n.startsWith(normPath(s.path) + '\\')); };
let workerSel = {}, logLevel = 'all';

function pSite(name, tab) {
  const s = siteOf(name); if (!s) { setTop(`<a href="#/sites">Sites</a>`); $('body').innerHTML = `<div class="empty"><b>Site introuvable</b></div>`; return; }
  const idx = S.sites.indexOf(s), st = siteState(s), m = s.metrics;
  setTop(`<a href="#/sites">Sites</a>${crumbSep}<b>${esc(s.name)}</b>`,
    `<span class="pager">${idx + 1} / ${S.sites.length}<button class="ib" onclick="stepSite(-1)" title="Précédent  K">${ic('up')}</button><button class="ib" onclick="stepSite(1)" title="Suivant  J">${ic('down')}</button></span>
     <button class="btn flat" onclick="act('/api/open-terminal',{site:${J(s.name)}})" title="Terminal avec PHP ${esc(s.php)} et Node ${esc(s.node)} de ce projet">${ic('term')}Terminal</button>
     <button class="btn flat" onclick="act('/api/open-editor',{path:${J(s.path)}})">${ic('code')}Éditeur</button>
     <button class="ib" onclick="act('/api/open',{path:${J(s.path)}})" title="Ouvrir le dossier">${ic('folder')}</button>
     <a class="btn" href="${esc(s.url)}" target="_blank" style="margin-left:4px">Visiter${ic('ext')}</a>`);
  const siteDumps = (window.DUMPS || []).filter(d => siteOfPath(d.root) === s);
  const tabs = [['overview', 'Aperçu'], ['workers', 'Workers', s.workers.length], ['debug', 'Débogage', siteDumps.length || null], ['settings', 'Réglages']];
  const tabbar = `<div class="tabs" style="padding:10px 0 12px;border:0;margin:14px 0 0">${tabs.map(([k, l, n]) => `<button class="pill ${tab === k ? 'on' : ''}" onclick="go('sites',${J(s.name)},'${k}')">${l}${n != null ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>`;
  const main = { overview: siteOverview, workers: siteWorkers, debug: siteDebug, settings: siteSettings }[tab] || siteOverview;
  $('body').innerHTML = `<div class="detail"><div class="main-col" style="padding-top:24px">
      <h1 class="title">${avatar(s.name, 'lg')}${esc(s.name)}${s.laravel ? chip('#f9322c', 'Laravel') : ''}</h1>
      <p class="lede"><a href="${esc(s.url)}" target="_blank" class="mono">${esc(s.url.replace('http://', ''))}</a><span>·</span><span class="mono">${esc(s.path)}</span></p>
      ${tabbar}<div id="sitetab">${main(s)}</div>
    </div>
    <aside class="props">
      <h4>Propriétés</h4>
      <div class="prop"><span class="k">Statut</span><span class="pv">${glyph(st)}<span class="t">${STATE_L[st]}</span></span></div>
      ${s.proxy ? '' : `<div class="prop"><span class="k">PHP</span><button class="pv" onclick="verMenu(this,'php',${J(s.name)})">${chip('var(--php)', esc(s.php))}<span class="t muted">${s.php_pinned ? 'isolé' : 'défaut'}</span></button></div>`}
      <div class="prop"><span class="k">Node.js</span><button class="pv" onclick="verMenu(this,'node',${J(s.name)})">${chip('var(--node)', esc(s.node))}<span class="t muted">${s.node_pinned ? 'isolé' : 'défaut'}</span></button></div>
      ${s.proxy ? '' : `<div class="prop"><span class="k">php-cgi</span><span class="pv"><span class="t ${s.php_running ? '' : 'muted'}">${s.php_running ? S.php_processes + ' processus' : 'au premier accès'}</span></span></div>`}
      <div class="prop"><span class="k">Workers</span><button class="pv" onclick="go('sites',${J(s.name)},'workers')">${s.workers.length ? `${glyph(s.workers.some(jobBad) ? 'err' : s.workers.every(w => w.running) ? 'ok' : 'off', 12)}<span class="t">${s.workers.filter(w => w.running).length}/${s.workers.length} en cours</span>` : '<span class="t muted">aucun</span>'}</button></div>
      <h4>Trafic</h4>
      <div class="prop"><span class="k">Requêtes</span><span class="pv"><span class="t" style="font-feature-settings:'tnum'">${m.requests}</span>${m.errors ? `<span style="color:var(--red)">${m.errors} err</span>` : ''}</span></div>
      <div class="prop"><span class="k">Dernière</span><span class="pv"><span class="t ${m.last_at ? '' : 'muted'}">${m.last_at ? `${ago(m.last_at)} · ${m.last_status} · ${m.last_ms} ms` : 'aucune'}</span></span></div>
      <div class="prop"><span class="k">Dumps</span><button class="pv" onclick="go('sites',${J(s.name)},'debug')"><span class="t ${siteDumps.length ? '' : 'muted'}">${siteDumps.length || 'aucun'}</span></button></div>
      <h4>Projet</h4>
      <div class="prop"><span class="k">Origine</span><span class="pv"><span class="t">${s.linked ? 'Lié' : 'Parqué'}</span></span></div>
      <div class="prop"><span class="k">Dossier</span><button class="pv" onclick="act('/api/open',{path:${J(s.path)}})" title="${esc(s.path)}">${ic('folder')}<span class="t">${esc(s.path.split(/[\\/]/).pop())}</span></button></div>
      <div class="prop"><span class="k">Config</span><button class="pv" onclick="act('/api/open-editor',{path:${J(s.path + '\\viherd.toml')}})">${ic('code')}<span class="t">viherd.toml</span></button></div>
      ${s.linked ? `<div class="prop"><span class="k"></span><button class="pv" style="color:var(--red)" onclick="act('/api/unlink',{name:${J(s.name)}},'Site délié').then(()=>go('sites'))">${ic('x')}<span class="t">Délier le site</span></button></div>` : ''}
    </aside></div>`;
  if (tab === 'workers' && s.workers.length) tail(workerSel[s.name] || s.workers[0].key);
  if (tab === 'debug') loadLaravelLog(s);
}

function siteOverview(s) {
  const ev = parseEvents().filter(e => e.site === s.name).slice(0, 12);
  return `<h3 class="h" style="margin-top:12px">Routage</h3>
    <div class="card">
      ${s.routes.map(r => `<div class="r"><span class="mono" style="width:90px">${esc(r.path)}</span><span style="color:var(--t4)">${ic('chev')}</span><span class="grow mono">127.0.0.1:${r.port}</span>${chip('var(--blue)', 'HTTP + WebSocket')}</div>`).join('')}
      <div class="r"><span class="mono" style="width:90px">/</span><span style="color:var(--t4)">${ic('chev')}</span><span class="grow mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.proxy ? '127.0.0.1:' + s.proxy : esc(s.docroot)}</span>${s.proxy ? chip('var(--node)', 'Proxy Node') : chip('var(--php)', 'PHP · statique')}</div>
    </div>
    <h3 class="h">Isolation</h3>
    <div class="card">
      <div class="r"><span style="color:var(--t3)">${ic('php')}</span><span class="grow">PHP <b class="mono" style="font-weight:500">${esc(s.php)}</b> <span class="dim">— php-cgi, workers, <span class="mono">viherd php</span> et le terminal de ce projet</span></span></div>
      <div class="r"><span style="color:var(--t3)">${ic('node')}</span><span class="grow">Node <b class="mono" style="font-weight:500">${esc(s.node)}</b> <span class="dim">— <span class="mono">viherd npm</span>, Vite et les workers Node</span></span></div>
      ${Object.keys(s.env || {}).length ? `<div class="r"><span style="color:var(--t3)">${ic('box')}</span><span class="grow">${Object.keys(s.env).length} variable(s) d'environnement propres au projet</span><button class="btn flat" onclick="go('sites',${J(s.name)},'settings')">Modifier</button></div>` : ''}
    </div>
    <h3 class="h">Activité</h3>
    ${ev.length ? feedHTML(ev) : `<p style="color:var(--t3);margin:0">Aucun événement pour ce site depuis le démarrage.</p>`}`;
}

/* ---------- workers ---------- */
const PRESETS = [
  { n: 'queue', c: 'php artisan queue:work --tries=3', d: 'Traite les jobs de la file' },
  { n: 'schedule', c: 'php artisan schedule:work', d: 'Lance les tâches planifiées chaque minute' },
  { n: 'horizon', c: 'php artisan horizon', d: 'Tableau de bord des queues Redis' },
  { n: 'reverb', c: 'php artisan reverb:start --host=127.0.0.1 --port=8080', d: 'WebSockets (ajoute la route /app)', route: { path: '/app', port: 8080 } },
  { n: 'pulse', c: 'php artisan pulse:check', d: 'Collecte des métriques Pulse' },
  { n: 'vite', c: 'npm run dev', d: 'Serveur Vite avec rechargement à chaud' },
];
function workerRow(s, w, sel) {
  const g = jobGlyph(w), run = w.running, uptime = run && w.since ? ' · ' + ago(w.since) : '';
  return `<div class="r" style="${sel ? 'background:var(--hover)' : ''};cursor:pointer" onclick="workerSel[${J(s.name)}]=${J(w.key)};render()">
    ${glyph(g)}<b style="font-weight:500;width:96px;overflow:hidden;text-overflow:ellipsis">${esc(w.name)}</b>
    <span class="grow mono dim wcmd" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.command)}</span>
    <span class="dim wst" style="font-size:12px;white-space:nowrap">${jobLabel(w)}${uptime}${w.restarts ? ` · ${w.restarts} redémarrage${w.restarts > 1 ? 's' : ''}` : ''}</span>
    ${run ? `<button class="ib" title="Redémarrer" onclick="event.stopPropagation();workerAct('restart',${J(w.key)})">${ic('restart')}</button><button class="ib" title="Arrêter" onclick="event.stopPropagation();workerAct('stop',${J(w.key)})">${ic('stop')}</button>`
          : `<button class="ib" title="Démarrer" onclick="event.stopPropagation();workerAct('start',${J(w.key)})">${ic('play')}</button>`}
    <button class="ib" title="Supprimer" onclick="event.stopPropagation();removeWorker(${J(s.name)},${J(w.name)})">${ic('trash')}</button></div>`;
}
function siteWorkers(s) {
  const sel = workerSel[s.name] || s.workers[0]?.key;
  return `<h3 class="h" style="margin-top:12px">Workers <span class="n">${s.workers.length}</span><span class="sp"></span><button class="btn" onclick="addWorkerMenu(this,${J(s.name)})">${ic('plus')}Ajouter</button></h3>
    ${s.workers.length ? `<div class="card">${s.workers.map(w => workerRow(s, w, w.key === sel)).join('')}</div>
      <h3 class="h">Sortie <span class="n">${esc(s.workers.find(w => w.key === sel)?.name || '')}</span><span class="sp"></span><span style="display:flex;gap:6px;align-items:center;color:var(--t3);font-size:12px">${glyph('live', 12)}En direct</span></h3>
      <pre class="term" id="log" style="max-height:none;height:calc(100vh - 470px);min-height:200px"></pre>`
    : `<div class="card"><div class="empty" style="padding:40px 20px"><div class="art">${ic('bolt')}</div><b>Aucun worker</b><span>Les workers tournent en continu avec le PHP et le Node de ce projet, et redémarrent s'ils plantent.</span><button class="btn pri" onclick="addWorkerMenu(this,${J(s.name)})">${ic('plus')}Ajouter un worker</button></div></div>`}`;
}
async function workerAct(action, key) {
  await act('/api/worker', { action, key }, { start: 'Worker démarré', stop: 'Worker arrêté', restart: 'Worker redémarré' }[action]);
}
function addWorkerMenu(anchor, site) {
  const s = siteOf(site), used = new Set(s.workers.map(w => w.name));
  popover(anchor, { width: 320, search: 'Modèle de worker…', items: [
    { label: s.laravel ? 'Laravel' : 'Modèles' },
    ...PRESETS.filter(p => !used.has(p.n)).map(p => ({ text: p.n, html: `<b style="font-weight:500">${p.n}</b> <span style="color:var(--t4)">— ${esc(p.d)}</span>`, icon: ic(p.n === 'vite' ? 'node' : 'bolt'), run: () => saveWorkers(s, [...s.workers, { name: p.n, command: p.c }], p.route) })),
    { sep: 1 },
    { text: 'Commande personnalisée…', icon: ic('term'), run: () => dlgWorker(site) },
  ] });
}
async function saveWorkers(s, workers, route) {
  const patch = { workers: workers.map(w => ({ name: w.name, command: w.command, autorestart: w.autorestart ?? true })) };
  if (route && !s.routes.some(r => r.path === route.path)) patch.routes = [...s.routes, route];
  await act('/api/site/project', { site: s.name, patch }, 'Workers mis à jour', 'Enregistrement…');
}
function removeWorker(site, name) {
  const s = siteOf(site);
  if (!confirm(`Supprimer le worker « ${name} » de ${site} ?`)) return;
  saveWorkers(s, s.workers.filter(w => w.name !== name));
}
function dlgWorker(site) {
  modal(`<div class="mh"><span class="chip"><i style="background:var(--accent)"></i>${esc(site)}</span>${ic('chev')}Nouveau worker</div>
    <input class="mt" id="w-cmd" placeholder="php artisan queue:work --queue=emails">
    <input class="md" id="w-name" placeholder="Nom (ex : emails)" onkeydown="if(event.key==='Enter')document.getElementById('m-ok').click()">
    <div class="mf"><span class="hint">Lancé avec le PHP et le Node du projet · redémarré s'il s'arrête</span><span class="sp"></span><button class="btn pri" id="m-ok" onclick="const c=document.getElementById('w-cmd').value.trim(),n=document.getElementById('w-name').value.trim();if(!c||!n)return toast('Nom et commande requis','err');closeAll();const s=siteOf(${J(site)});saveWorkers(s,[...s.workers,{name:n,command:c}])">Ajouter</button></div>`);
}

/* ---------- débogage d'un site : dumps + log Laravel ---------- */
function siteDebug(s) {
  const ds = (window.DUMPS || []).filter(d => siteOfPath(d.root) === s);
  return `<h3 class="h" style="margin-top:12px">Dumps <span class="n">${ds.length}</span><span class="sp"></span>${dumpToggle()}</h3>
    ${ds.length ? ds.slice(0, 30).map(dumpCard).join('') : `<div class="card"><div class="r dim">${S.dumps_enabled ? `Appelle <span class="mono">dump($x)</span> ou <span class="mono">dd($x)</span> dans ce projet : le résultat s'affiche ici au lieu de la page.` : 'La capture des dumps est désactivée.'}</div></div>`}
    <h3 class="h">Log Laravel <span class="n" id="ll-file"></span><span class="sp"></span>
      <span class="seg" id="ll-seg">${['all', 'error', 'warning', 'info', 'debug'].map(l => `<button class="${logLevel === l ? 'on' : ''}" onclick="logLevel='${l}';loadLaravelLog(siteOf(${J(s.name)}))">${{ all: 'Tout', error: 'Erreurs', warning: 'Alertes', info: 'Info', debug: 'Debug' }[l]}</button>`).join('')}</span>
      <button class="ib" title="Vider le log" onclick="if(confirm('Vider le fichier de log ?'))act('/api/site/laravel-log/clear',{site:${J(s.name)}},'Log vidé')">${ic('trash')}</button></h3>
    <div id="ll"><div class="card"><div class="r dim">Chargement…</div></div></div>`;
}
async function loadLaravelLog(s) {
  const r = await fetch('/api/site/laravel-log?site=' + encodeURIComponent(s.name)).then(r => r.json()).catch(() => ({}));
  const box = $('ll'); if (!box) return;
  document.querySelectorAll('#ll-seg button').forEach(b => b.classList.toggle('on', b.textContent === { all: 'Tout', error: 'Erreurs', warning: 'Alertes', info: 'Info', debug: 'Debug' }[logLevel]));
  if (!r.file) { box.innerHTML = `<div class="card"><div class="r dim">Pas de <span class="mono">storage/logs/*.log</span> dans ce projet.</div></div>`; return; }
  $('ll-file').textContent = r.file.split(/[\\/]/).pop();
  const parts = r.text.replace(/^﻿/, '').split(/^(?=\[\d{4}-\d\d-\d\d[ T]\d\d:\d\d:\d\d[^\]]*\] \w+\.\w+:)/m);
  let entries = parts.map(p => { const m = p.match(/^\[([^\]]+)\] (\w+)\.(\w+): ([\s\S]*)$/); return m && { t: m[1], env: m[2], lvl: m[3].toLowerCase(), msg: m[4].trim() }; }).filter(Boolean).reverse();
  const rank = { emergency: 'error', alert: 'error', critical: 'error', error: 'error', warning: 'warning', notice: 'info', info: 'info', debug: 'debug' };
  if (logLevel !== 'all') entries = entries.filter(e => rank[e.lvl] === logLevel);
  const color = l => ({ error: 'var(--red)', warning: 'var(--amber)', info: 'var(--blue)', debug: 'var(--t4)' })[rank[l]] || 'var(--t4)';
  box.innerHTML = entries.length ? `<div class="card">${entries.slice(0, 80).map(e => { const [first, ...rest] = e.msg.split('\n'); return `<details class="r" style="display:block;padding:9px 12px">
      <summary style="display:flex;gap:10px;align-items:baseline;cursor:pointer;list-style:none"><span class="chip" style="height:20px;flex:none"><i style="background:${color(e.lvl)}"></i>${esc(e.lvl)}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(first)}</span><time class="dim mono" style="font-size:11.5px;flex:none">${esc(e.t.slice(11, 19))}</time></summary>
      ${rest.length ? `<pre class="term" style="margin-top:8px;max-height:280px">${esc(rest.join('\n'))}</pre>` : ''}</details>`; }).join('')}</div>`
    : `<div class="card"><div class="r dim">Aucune entrée${logLevel !== 'all' ? ' pour ce niveau' : ''}.</div></div>`;
}

/* =====================================================================
   Workers & queues — inspiré de Laravel Horizon et des « background workers » de Railway / Render
   ===================================================================== */
const WK = { sel: null, q: '', paused: false, wrap: true, lines: [], key: null, queue: {}, timer: null };
/* type de worker déduit de sa commande */
function wkind(c) {
  return /queue:(work|listen)/.test(c) ? { k: 'queue', l: 'Queue', c: '#7c7ff5', i: 'inbox' }
    : /schedule:(work|run)/.test(c) ? { k: 'schedule', l: 'Scheduler', c: '#4cb782', i: 'restart' }
    : /horizon/.test(c) ? { k: 'horizon', l: 'Horizon', c: '#a78bfa', i: 'bolt' }
    : /reverb:start/.test(c) ? { k: 'reverb', l: 'Reverb', c: '#f2c94c', i: 'pulse' }
    : /pulse:(check|work)/.test(c) ? { k: 'pulse', l: 'Pulse', c: '#ff5caa', i: 'pulse' }
    : /\b(npm|pnpm|yarn|vite|bun)\b/.test(c) ? { k: 'vite', l: 'Vite / Node', c: '#5fa04e', i: 'node' }
    : { k: 'custom', l: 'Commande', c: '#8a8f98', i: 'term' };
}
const queueName = c => (c.match(/--queue[= ](\S+)/) || [])[1] || 'default';
const allWorkers = () => S.sites.flatMap(s => s.workers.map(w => ({ ...w, site: s })));

    $('body').innerHTML = `<div class="sp"><div class="sp-head"><div><h1>Workers & queues</h1><p>Des processus qui tournent en continu avec le PHP et le Node de chaque projet, et redémarrent s'ils plantent.</p></div></div>
      <div class="first">${[['queue', 'Queue', 'Traite tes jobs en arrière-plan', 'inbox', '#7c7ff5'], ['schedule', 'Scheduler', 'Lance tes tâches planifiées chaque minute', 'restart', '#4cb782'], ['reverb', 'Reverb', 'WebSockets temps réel', 'pulse', '#f2c94c'], ['vite', 'Vite', 'Rechargement à chaud du front', 'node', '#5fa04e']].map(([k, l, d, i, c]) =>
        `<button onclick="${S.sites.length ? `addWorkerFor(this,${J(k)})` : 'dlgNew()'}"><span class="brand" style="${tint(c)}">${ic(i)}</span><b>${l}</b><span>${d}</span></button>`).join('')}</div></div>`;
    return;
  }
  const filt = w => !WK.q || (w.name + ' ' + w.command + ' ' + w.site.name).toLowerCase().includes(WK.q);

  $('body').innerHTML = `<div class="wk">
    <aside class="wk-list">
      <div class="wk-sum">
        <span class="wk-pill ok">${glyph('ok', 11)}<b>${n.run}</b> en cours</span>
        ${n.bad ? `<span class="wk-pill err">${glyph('err', 11)}<b>${n.bad}</b> en erreur</span>` : ''}
        ${n.off ? `<span class="wk-pill">${glyph('off', 11)}<b>${n.off}</b> arrêté${n.off > 1 ? 's' : ''}</span>` : ''}
      </div>
      <label class="find wk-find">${ic('search')}<input placeholder="Filtrer les workers…" value="${esc(WK.q)}" oninput="WK.q=this.value.toLowerCase();pWorkers()"></label>
      <div class="wk-scroll">${sites.map(s => `<div class="wk-site">
          <a class="wk-site-h" href="#/sites/${encodeURIComponent(s.name)}/workers">${avatar(s.name)}<b>${esc(s.name)}</b><span class="dim">PHP ${esc(s.php)}</span></a>
          ${s.workers.filter(w => filt({ ...w, site: s })).map(w => { const t = wkind(w.command); return `<button class="wk-item ${w.key === WK.sel ? 'on' : ''} ${jobBad(w) ? 'bad' : ''}" onclick="go('workers',${J(w.key)})">
            <span class="wk-ic" style="${tint(t.c)}">${ic(t.i)}</span>
            <span class="wk-txt"><b>${esc(w.name)}</b><span class="mono">${esc(w.command)}</span></span>
            <span class="wk-st">${glyph(jobGlyph(w), 10)}<span>${w.running && w.since ? `<span class="uptime" data-since="${w.since}">${ago(w.since)}</span>` : esc(jobLabel(w))}</span></span></button>`; }).join('')}
        </div>`).join('') || '<div class="dim" style="padding:12px">Aucun worker ne correspond.</div>'}
        <button class="wk-add" onclick="addWorkerFor(this)">${ic('plus')}Ajouter un worker</button>
      </div>

    <section class="wk-main" id="wk-main">${sel ? workerDetail(sel) : ''}</section></div>`;

    ${t.k === 'queue' || t.k === 'horizon' ? `<div id="wk-queue" class="wk-queue"><div class="dim" style="font-size:12px">Lecture de la file…</div></div>` : ''}
    <div class="wk-log">
      <div class="wk-log-bar"><b>Sortie</b><span class="live-dot">${glyph(WK.paused ? 'off' : 'live', 10)}${WK.paused ? 'En pause' : 'En direct'}</span>

async function loadQueue(site) {
  const box = $('wk-queue'); if (!box) return;

  if (!$('wk-queue')) return;
  if (!q.supported) { box.innerHTML = `<div class="wk-q-off">${ic('inbox')}<span><b>File non suivie</b> · ${esc(q.reason || '')}${q.connection ? ` <span class="mono dim">QUEUE_CONNECTION=${esc(q.connection)}</span>` : ''}</span></div>`; return; }
  const pend = q.queues.reduce((a, x) => a + x.pending - x.running, 0), run = q.queues.reduce((a, x) => a + x.running, 0);
  box.innerHTML = `<div class="wk-q-h"><b>File Laravel</b><span class="dim mono">${esc(q.engine)} · ${esc(q.database)}</span><span class="sp"></span>
      <button class="btn flat" onclick="artisanQ(${J(site)},'restart')" title="php artisan queue:restart — recharge le code des workers">${ic('restart')}queue:restart</button>

    ${q.failed ? `<div class="wk-fail-h"><b>Jobs échoués</b><span class="sp"></span><button class="btn flat" onclick="artisanQ(${J(site)},'retry-all')">${ic('restart')}Tout relancer</button><button class="btn flat danger" onclick="if(confirm('Supprimer définitivement tous les jobs échoués ?'))artisanQ(${J(site)},'flush')">${ic('trash')}Vider</button></div>
      <div class="wk-fails">${q.recent_failed.map(f => `<div class="wk-fail"><div class="grow" style="min-width:0"><div class="wk-fail-t"><b class="mono">${esc(f.job || 'Job')}</b><span class="dim">${esc(f.queue || '')} · ${esc((f.failed_at || '').replace(/\.\d+.*$/, ''))}</span></div><div class="wk-fail-e">${esc(f.error || '')}</div></div>

}
async function artisanQ(site, cmd, id) {
  const b = toast(`php artisan ${cmd === 'retry-all' ? 'queue:retry all' : cmd === 'retry' ? 'queue:retry' : 'queue:' + cmd}…`, 'busy');
  try { const r = await dbPost('/api/site/artisan', { site, cmd, id }); toast(r.output?.split('\n').filter(Boolean).pop() || 'Fait'); loadQueue(site); } catch (e) { toast(e.message, 'err', 8000); } finally { b.remove(); }
}

/* sortie du worker : lecture continue, filtre, pause, retour à la ligne */
function workerTail(key) {
  stopTail(); clearInterval(WK.timer);
  if (WK.key !== key) { WK.lines = []; WK.key = key; }
  const tick = async () => {
    if (!$('wk-out')) return clearInterval(WK.timer);
    const r = await fetch('/api/logs?key=' + encodeURIComponent(key) + '&n=800').then(r => r.json()).catch(() => ({ log: '' }));
    const lines = (r.log || '').split('\n'); if (lines.join('\n') === WK.lines.join('\n')) return;
    WK.lines = lines; drawWorkerLog();
  };
  tick(); WK.timer = setInterval(tick, 1500);
}
function drawWorkerLog() {
  const el = $('wk-out'); if (!el) return;
  const f = ($('wk-lq')?.value || '').toLowerCase();
  const lines = WK.lines.filter(l => !f || l.toLowerCase().includes(f));
  el.classList.toggle('nowrap', !WK.wrap);
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.innerHTML = lines.length && lines.some(Boolean) ? lines.map(l => {
    const c = /\b(error|fatal|exception|failed|échec)\b|✖/i.test(l) ? 'e' : /\bwarn(ing)?\b/i.test(l) ? 'w' : /\b(DONE|processed|success|réussi)\b|✔/i.test(l) ? 'ok' : /\bRUNNING\b|processing/i.test(l) ? 'run' : '';
    return `<span class="${c}">${esc(l)}</span>`;
  }).join('\n') : `<span class="dim">${f ? 'Aucune ligne ne correspond.' : 'Aucune sortie pour l’instant.'}</span>`;
  if (!WK.paused && (atBottom || !f)) el.scrollTop = el.scrollHeight;
}

/* =====================================================================
   Bases de données — explorateur inspiré de l'éditeur de tables Supabase, TablePlus et Prisma Studio
   ===================================================================== */
const DB = { svc: null, db: null, table: null, view: 'overview', dbs: [], tables: [], cols: [], data: null, page: 0, size: 50, order: '', desc: false,
  filters: [], whereRaw: '', filterMode: 'builder', filterOpen: false, sel: new Set(), hidden: {}, result: null, tq: '', backups: null, err: null, row: null };

async function dbGet(path, params) { const r = await fetch(path + '?' + new URLSearchParams(params)); const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Erreur'); return j; }

const dbQ = (extra = {}) => ({ svc: DB.svc, db: DB.db, ...extra });
const dlUrl = (path, params) => path + '?' + new URLSearchParams(params);
const fmtSize = n => n == null ? '—' : n < 1024 ? n + ' o' : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' Ko' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' Mo' : (n / 1073741824).toFixed(2) + ' Go';

/* ---------- types de colonnes ---------- */
const tkind = t => { t = (t || '').toLowerCase(); return /bool|tinyint\(1\)/.test(t) ? 'bool' : /int|serial|numeric|decimal|real|double|float|money/.test(t) ? 'num' : /date|time/.test(t) ? 'date' : /json/.test(t) ? 'json' : /uuid/.test(t) ? 'uuid' : /bytea|blob|binary/.test(t) ? 'bin' : 'text'; };
const TK = { num: '#', text: 'Aa', bool: '◐', date: '◷', json: '{}', uuid: 'id', bin: '01' };
const colMeta = n => DB.cols.find(c => c.name === n) || {};
function cellHTML(v, kind) {
  if (v == null) return '<span class="c-null">NULL</span>';
  const s = String(v);
  if (kind === 'bool') { const on = /^(t|true|1)$/i.test(s); return `<span class="c-bool ${on ? 'on' : ''}">${on ? 'true' : 'false'}</span>`; }
  if (kind === 'json') return `<span class="c-json">${esc(s.slice(0, 120))}</span>`;
  if (kind === 'date') return `<span class="c-date">${esc(s.replace(/\.\d+/, ''))}</span>`;
  return esc(s.length > 160 ? s.slice(0, 160) + '…' : s);
}

/* ---------- filtres (constructeur façon Supabase) ---------- */
const qid = c => DB.svc === 'mysql' ? '`' + c.replace(/`/g, '``') + '`' : '"' + c.replace(/"/g, '""') + '"';
const qlit = v => DB.svc === 'mysql' ? "'" + v.replace(/\\/g, '\\\\').replace(/'/g, "''") + "'" : "'" + v.replace(/'/g, "''") + "'";
const OPS = [['eq', '='], ['ne', '≠'], ['gt', '>'], ['lt', '<'], ['like', 'contient'], ['starts', 'commence par'], ['null', 'est NULL'], ['notnull', "n'est pas NULL"]];
function filterSQL(f) {
  const c = qid(f.col), v = f.val ?? '', txt = DB.svc === 'mysql' ? c : c + '::text', like = DB.svc === 'mysql' ? 'LIKE' : 'ILIKE';
  return { eq: `${c} = ${qlit(v)}`, ne: `${c} <> ${qlit(v)}`, gt: `${c} > ${qlit(v)}`, lt: `${c} < ${qlit(v)}`,
    like: `${txt} ${like} ${qlit('%' + v + '%')}`, starts: `${txt} ${like} ${qlit(v + '%')}`, null: `${c} IS NULL`, notnull: `${c} IS NOT NULL` }[f.op];
}
const activeFilters = () => DB.filters.filter(f => f.col && (['null', 'notnull'].includes(f.op) || f.val !== ''));
const whereClause = () => DB.filterMode === 'sql' ? DB.whereRaw : activeFilters().map(filterSQL).join(' AND ');

/* tables techniques de Laravel (cache, files, sessions…) : rangées à part pour laisser les tables métier en avant */
const LARA_SYS = /^(migrations|cache|cache_locks|jobs|job_batches|failed_jobs|sessions|password_reset_tokens|password_resets|personal_access_tokens|telescope_\w+|pulse_\w+)$/;
let tSort = 'name', sysOpen = false;
try { tSort = localStorage.getItem('dbTableSort') || 'name'; sysOpen = localStorage.getItem('dbSysOpen') === '1'; } catch {}
const compact = n => n == null ? '' : n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0).replace('.0', '') + 'k' : (n / 1e6).toFixed(1).replace('.0', '') + 'M';
function tItem(t) {
  const empty = !t.rows;
  return `<a class="titem ${t.name === DB.table ? 'on' : ''} ${empty ? 'is-empty' : ''}" href="${dbHref(t.name)}" title="${esc(t.name)} · ${fmtNum(t.rows)} ligne${t.rows > 1 ? 's' : ''} · ${t.columns ?? '?'} colonnes · ${fmtSize(t.size)}">
    <svg class="ti" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M2 6.5h12M6 6.5v7"/></svg>
    <span class="t">${esc(t.name)}</span><span class="n">${empty ? '' : compact(t.rows)}</span></a>`;
}

  if (!list.length) { el.innerHTML = `<div class="dim" style="padding:8px 10px;font-size:12px">${DB.tables.length ? 'Aucune table ne correspond.' : 'Aucune table.'}</div>`; return; }
  const app = list.filter(t => !LARA_SYS.test(t.name)), sys = list.filter(t => LARA_SYS.test(t.name));
  const showSys = sysOpen || q || sys.some(t => t.name === DB.table);
  el.innerHTML = (app.length ? app.map(tItem).join('') : `<div class="dim" style="padding:6px 10px;font-size:12px">Pas encore de table métier.</div>`)
    + (sys.length ? `<button class="tgrp ${showSys ? 'open' : ''}" onclick="sysOpen=!sysOpen;try{localStorage.setItem('dbSysOpen',sysOpen?'1':'0')}catch{};drawTables()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg><span class="lara-dot"></span>Laravel<span class="n">${sys.length}</span></button>

}

async function dbData(reload = true) {

    catch (e) { DB.err = e.message; DB.data = DB.data || { columns: DB.cols.map(c => c.name), rows: [], total: 0 }; }

  const d = DB.data, pks = pkCols(), editable = pks.length > 0, hid = hiddenSet();
  const vis = d.columns.map((c, j) => ({ c, j, k: tkind(colMeta(c).type) })).filter(x => !hid.has(x.c));
  const from = d.total ? DB.page * DB.size + 1 : 0, to = Math.min(d.total, (DB.page + 1) * DB.size), pages = Math.max(1, Math.ceil(d.total / DB.size));
  const nf = activeFilters().length + (DB.filterMode === 'sql' && DB.whereRaw.trim() ? 1 : 0);
  box.innerHTML = `

async function dbBackupNow() {

function dbRestore(file, label) {

/* Panneau latéral d'un service : logs, .env, infos */
let sheetSvc = null, sheetTab = 'logs';
function openSvc(name, tab) {
  const svc = S.services.find(x => x.name === name);
  if (name === 'minio' && svc && !svc.license && !tab) tab = 'license';
  if (sheetTab === 'license' && name !== 'minio' && !tab) tab = 'logs';
  sheetSvc = name; sheetTab = tab || sheetTab;
  drawSheet(); $('sheet').classList.add('open'); $('veil').classList.add('open');
}
function drawSheet() {
  const s = S.services.find(x => x.name === sheetSvc); if (!s) return;
  const m = SVC[s.name] || { l: s.name, d: '', i: 'db', conn: () => '', env: () => '' };
  const [g, lab] = svcState(s);
  $('sheet').innerHTML = `<div class="sh"><span class="brand" style="${tint(SVC_COLOR[s.name] || '#888')}">${ic(m.i)}</span>

    <div class="sb">${sheetTab === 'logs' ? `<pre class="term tall" id="log" style="border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);height:100%"></pre>`

      : sheetTab === 'db' ? `<div id="dblist" style="margin-top:14px"><div class="card mini"><div class="r dim">${s.running ? 'Chargement…' : 'Démarre le service pour voir ses bases.'}</div></div></div>`
      : sheetTab === 'env' ? `<p class="dim" style="font-size:12px;margin:14px 0 8px">À coller dans le <span class="mono">.env</span> de ton projet Laravel.</p><pre class="code">${esc(m.env(s))}</pre><button class="btn" style="margin-top:10px" onclick="copy(${J(m.env(s))},'Bloc copié')">${ic('copy')}Copier</button>`
      : `<div class="card mini" style="margin-top:14px">
          <div class="r"><span class="grow dim">Adresse</span><button class="chip btnlike mono" onclick="copy(${J(m.conn(s))},'Copié')">${esc(m.conn(s))}</button></div>
          ${m.dash ? `<div class="r"><span class="grow dim">${m.dashL}</span><a class="mono" href="${esc(m.dash(s))}" target="_blank">${esc(m.dash(s))}</a></div>` : ''}
          <div class="r"><span class="grow dim">PID</span><span class="mono">${s.pid ?? '—'}</span></div>
          <div class="r"><span class="grow dim">Redémarrages</span><span class="mono">${s.restarts}</span></div>
          <div class="r"><span class="grow dim">Données</span><span class="mono" style="font-size:11.5px">~/.viherd/data/${esc(s.name)}</span></div>
          ${s.error ? `<div class="r" style="color:var(--red)">${esc(s.error)}</div>` : ''}</div>`}</div>`;
  if (sheetTab === 'logs') tail(s.key); else stopTail();
  if (sheetTab === 'db' && s.running) loadDbs(s.name);

async function loadDbs(name) {
  const box = $('dblist'); if (!box) return;
  const r = await fetch('/api/service/databases?name=' + encodeURIComponent(name)).then(r => r.json()).catch(e => ({ error: e.message }));
  if (!$('dblist')) return;
  const suggest = S.sites.filter(s => s.laravel).map(s => s.name.replace(/-/g, '_')).filter(n => !(r.databases || []).includes(n)).slice(0, 4);
  $('dblist').innerHTML = r.error ? `<div class="card mini"><div class="r" style="color:var(--red)">${esc(r.error)}</div></div>` : `
    <div class="card mini">${(r.databases || []).map(d => `<div class="r">${ic('db')}<a class="grow mono" style="cursor:pointer" onclick="closeAll();go('db',${J(name)},${J(d)})" title="Ouvrir dans l'explorateur">${esc(d)} →</a><button class="ib" title="Copier DB_DATABASE" onclick="copy('DB_DATABASE=${esc(d)}','DB_DATABASE copié')">${ic('copy')}</button></div>`).join('') || '<div class="r dim">Aucune base pour l’instant.</div>'}</div>
    <div style="display:flex;gap:8px;margin-top:12px"><input class="input mono" id="newdb" style="flex:1" placeholder="laravel" onkeydown="if(event.key==='Enter')createDb(${J(name)})"><button class="btn pri" onclick="createDb(${J(name)})">${ic('plus')}Créer la base</button></div>
    ${suggest.length ? `<p class="dim" style="font-size:12px;margin:10px 0 4px">Pour tes projets Laravel :</p><div style="display:flex;gap:6px;flex-wrap:wrap">${suggest.map(n => `<button class="chip btnlike mono" onclick="document.getElementById('newdb').value=${J(n)};createDb(${J(name)})">${ic('plus')}${esc(n)}</button>`).join('')}</div>` : ''}
    <p class="dim" style="font-size:12px;margin-top:14px">Le nom doit correspondre à <span class="mono">DB_DATABASE</span> dans le <span class="mono">.env</span> du projet.</p>`;
}
async function createDb(name) {
  const db = $('newdb').value.trim() || 'laravel';
  try { await act('/api/service/databases', { name, database: db }, `Base « ${db} » créée`, 'Création…'); } catch { return; }
  loadDbs(name);
}

  const block = (kind, title, color, sugg) => {

    const all = [...new Set([...list, def])].sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
    return `<h3 class="h">${title} <span class="n">${list.length}</span></h3><div class="card">
      ${all.map(v => { const ok = list.includes(v); return `<div class="r">${glyph(ok ? 'ok' : 'idle')}<span class="mono" style="width:70px;font-size:13px;color:var(--t1)">${esc(v)}</span>

        ${v === def ? `<span class="chip"><i style="background:${color}"></i>Par défaut</span>` : `<button class="btn flat" onclick="act('/api/defaults',{${kind}:${J(v)}},'${title} ${esc(v)} par défaut')">Par défaut</button>`}
        ${ok ? '' : `<button class="btn" onclick="install('${kind}',${J(v)})">${ic('dl')}Installer</button>`}</div>`; }).join('')}
      ${sugg.filter(v => !all.includes(v)).map(v => `<div class="r" style="color:var(--t3)">${glyph('off')}<span class="mono" style="width:70px;font-size:13px">${v}</span><span class="grow">disponible</span><button class="btn flat" onclick="install('${kind}','${v}')">${ic('dl')}Installer</button></div>`).join('')}

  [['Bases de données', 'db', 'db', ['G', 'B']], ['Activité', 'pulse', 'activity', ['G', 'A']], ['Sites', 'globe', 'sites', ['G', 'S']], ['Workers & queues', 'bolt', 'workers', ['G', 'W']], ['Dumps', 'bug', 'debug', ['G', 'X']], ['Mail', 'inbox', 'mail', ['G', 'M']], ['Services', 'db', 'services', ['G', 'D']], ['PHP & Node', 'layers', 'runtimes', ['G', 'R']], ['Logs', 'term', 'logs', ['G', 'L']]]
    .forEach(([l, i, p, k]) => out.push({ g: 'Navigation', l: 'Aller à ' + l, i, k, run: () => go(p) }));
  return out.filter(o => m(o.l) || (o.h && m(o.h)));
}
function ckDraw() {
  ck = ckItems(); ckIdx = Math.min(ckIdx, Math.max(0, ck.length - 1)); let g = '';
  $('cmdk-res').innerHTML = ck.map((c, i) => (c.g !== g ? `<div class="lbl">${esc(g = c.g)}</div>` : '') + `<div class="o ${i === ckIdx ? 'on' : ''}" data-i="${i}">${c.gl ? glyph(c.gl) : ic(c.i)}<span>${esc(c.l)}</span>${c.k ? `<span class="k">${c.k.map(x => `<kbd>${x}</kbd>`).join('')}</span>` : c.h ? `<small>${esc(c.h)}</small>` : ''}</div>`).join('') || '<div class="lbl">Aucun résultat</div>';
  $('cmdk-res').querySelectorAll('.o').forEach(o => { o.onmousemove = () => { if (ckIdx !== +o.dataset.i) { ckIdx = +o.dataset.i; ckDraw(); } }; o.onclick = () => ckRun(+o.dataset.i); });
  $('cmdk-res').querySelector('.o.on')?.scrollIntoView({ block: 'nearest' });
}
function ckRun(i) { const c = ck[i]; if (!c) return; closeAll(); c.run(); }
$('cmdk-in').oninput = () => { ckIdx = 0; ckDraw(); };
$('cmdk-in').onkeydown = e => {
  if (e.key === 'ArrowDown') { ckIdx = (ckIdx + 1) % ck.length; ckDraw(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { ckIdx = (ckIdx - 1 + ck.length) % ck.length; ckDraw(); e.preventDefault(); }
  else if (e.key === 'Enter') ckRun(ckIdx); else if (e.key === 'Escape') closeAll();
};

/* =====================================================================
   Clavier : Ctrl K, G puis lettre, J/K, O, A, Shift T
   ===================================================================== */
let gPending = 0;
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('cmdk').classList.contains('open') ? closeAll() : openCmdk(); }
  if (e.key === 'Escape') { if (popEl || $('veil').classList.contains('open')) return closeAll(); if (route()[0] === 'sites' && route()[1]) return go('sites'); }
  if (popEl || $('veil').classList.contains('open') || /input|textarea|select/i.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey || !S) return;
  const k = e.key.toLowerCase();
  if (gPending && Date.now() - gPending < 900) { gPending = 0; const to = { b: 'db', a: 'activity', s: 'sites', w: 'workers', x: 'debug', m: 'mail', d: 'services', r: 'runtimes', l: 'logs' }[k]; if (to) go(to); return; }
  if (k === 'g') { gPending = Date.now(); return; }
  if (e.key === 'T' && e.shiftKey) return toggleTheme();
  if (k === 'a') return dlgPark();
  if (k === 'n') return dlgNew();
  if (e.key === '/' && $('jr-q')) { e.preventDefault(); return $('jr-q').focus(); }
  const [r, a] = route();
  if (r === 'sites' && a) {
    if (k === 'j') stepSite(1); else if (k === 'k') stepSite(-1); else if (k === 'o') window.open(siteOf(a)?.url);
    else if (k === 't') act('/api/open-terminal', { site: a }); else if (k === 'e') act('/api/open-editor', { path: siteOf(a)?.path });
    return;
  }
  if (r === 'sites' && LIST.length) {
    if (k === 'j' || e.key === 'ArrowDown') { kb = Math.min(kb + 1, LIST.length - 1); listOnly(); document.querySelector('.li.kb')?.scrollIntoView({ block: 'nearest' }); e.preventDefault(); }
    else if (k === 'k' || e.key === 'ArrowUp') { kb = Math.max(kb - 1, 0); listOnly(); document.querySelector('.li.kb')?.scrollIntoView({ block: 'nearest' }); e.preventDefault(); }
    else if (e.key === 'Enter' && kb >= 0) go('sites', LIST[kb].name);
    else if (k === 'o' && kb >= 0) window.open(LIST[kb].url);
    else if (e.key === '/') { e.preventDefault(); $('q')?.focus(); }
  }
});
const applyTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {} };
function toggleTheme() { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); }
try { applyTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')); } catch {}

/* =====================================================================
   Boucle de rafraîchissement
   ===================================================================== */
/* pied de barre latérale : identité + état, menu au clic */
function drawFoot(online) {
  $('me-dot').className = online ? '' : 'off';
  const s = $('me-s'); s.className = online ? '' : 'off';
  s.textContent = online ? `En ligne · :${S.http_port} · ${uptime(S.uptime)}` : 'Démon injoignable';
}
function meMenu(anchor) {
  anchor.classList.add('open');
  const up = S ? S.services.filter(s => s.running).length : 0, all = S ? S.services.filter(s => s.enabled || s.running).length : 0;
  popover(anchor, { width: 240, up: true, onClose: () => anchor.classList.remove('open'), items: [
    { label: S ? `Actif depuis ${uptime(S.uptime)} · v${S.version}` : 'Hors ligne' },
    { text: 'Services', icon: ic('db'), hint: `${up}/${all}`, run: () => go('services') },
    { text: 'Journal du démon', icon: ic('term'), run: () => go('logs', 'daemon') },
    { text: 'Ouvrir le dossier des logs', icon: ic('folder'), run: () => act('/api/open', { path: S.logs_dir }) },
    { sep: 1 },
    { text: document.documentElement.dataset.theme === 'dark' ? 'Thème clair' : 'Thème sombre', icon: ic('sun'), hint: 'Shift T', run: toggleTheme },
    { text: 'Recharger la configuration', icon: ic('refresh'), run: () => act('/api/reload', {}, 'Rechargé') },
    { sep: 1 },
    { text: 'Quitter Viherd', icon: ic('stop'), run: () => { if (confirm('Arrêter Viherd et tous ses services ?')) fetch('/api/quit', { method: 'POST' }); } },
  ] });
}
let sig = '';
async function refresh(force) {
  try {
    const [st, lg, dp] = await Promise.all([fetch('/api/state').then(r => r.json()), fetch('/api/logs?key=daemon').then(r => r.json()).catch(() => ({ log: '' })), fetch('/api/dumps').then(r => r.json()).catch(() => [])]);
    S = st; LOG = (lg.log || '').split('\n'); window.DUMPS = dp;
    drawFoot(true);
    const s = JSON.stringify({ ...S, uptime: 0, sites: S.sites.map(x => ({ ...x, metrics: { ...x.metrics, recent: 0, last_ms: 0 } })), log: LOG.length });
    const busy = popEl || $('veil').classList.contains('open') || (/input|select/i.test(document.activeElement?.tagName));
    if ($('sheet').classList.contains('open')) { if (s !== sig) { sig = s; drawSheet(); } renderNav(); }
    else if (route()[0] === 'activity' && route()[1] === 'journal' && !force && sig) { sig = s; renderNav(); journalTick(); }
    else if (route()[0] === 'db' && !force && sig) { sig = s; renderNav(); }
    else if (force || (s !== sig && !busy)) { sig = s; const keep = $('log')?.scrollTop; render(); if (keep != null && $('log')) $('log').scrollTop = keep; }
    else renderNav();
  } catch {
    drawFoot(false);
    if (!S) { setTop('<b>Viherd</b>'); $('body').innerHTML = `<div class="empty" style="height:100%"><div class="art">${ic('bolt')}</div><b>Le démon ne répond pas</b><span>Lance <span class="mono">viherd start</span> ou l'application. Reconnexion automatique.</span></div>`; }
  }
}
refresh(); setInterval(refresh, 2500);

/* Mode dev (VIHERD_DEV=1, lancé par dev.ps1) : rechargement automatique quand src/ui.html change.
   La route (#/…) est conservée, donc on reste sur la même page. */
(async () => {
  try {
    const d = await fetch('/api/dev').then(r => r.json());
    if (!d.dev) return;
    document.body.classList.add('devmode');
    let stamp = d.stamp;
    setInterval(async () => {
      try { const x = await fetch('/api/dev').then(r => r.json()); if (x.stamp && x.stamp !== stamp) location.reload(); } catch {}
    }, 500);
  } catch {}
})();
</script>
