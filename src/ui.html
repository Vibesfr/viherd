<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viherd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Tokens — noir profond, gris neutres, blanc comme couleur d'action (façon Vercel)
   ===================================================================== */
:root {
  --bg: #000; --bg-1: #0a0a0a; --bg-2: #111; --bg-3: #171717; --bg-4: #262626;
  --line: #1f1f1f; --line-2: #262626; --line-3: #333; --line-4: #3a3a3a;
  --t1: #ededed; --t2: #a1a1a1; --t3: #737373; --t4: #525252;
  --pri: #ededed; --pri-t: #0a0a0a; --pri-h: #fff;
  --green: #45c27a; --amber: #f5a524; --red: #f05252; --blue: #3b9eff;
  --red-soft: rgba(240,82,82,.06); --red-line: rgba(240,82,82,.35);
  --shadow: 0 16px 40px rgba(0,0,0,.6);
  --font: "Geist", system-ui, "Segoe UI", sans-serif;
  --mono: "Geist Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #fafafa; --bg-1: #fff; --bg-2: #f5f5f5; --bg-3: #ededed; --bg-4: #e2e2e2;
  --line: #ededed; --line-2: #e5e5e5; --line-3: #d4d4d4; --line-4: #c4c4c4;
  --t1: #171717; --t2: #666; --t3: #8f8f8f; --t4: #b0b0b0;
  --pri: #171717; --pri-t: #fff; --pri-h: #000;
  --green: #1f9d55; --amber: #c27c00; --red: #e5484d; --blue: #0a6fdb;
  --red-soft: rgba(229,72,77,.05); --red-line: rgba(229,72,77,.35);
  --shadow: 0 16px 40px rgba(0,0,0,.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--t1); overflow: hidden; }
body { font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
::selection { background: rgba(127,127,127,.28); }
input::placeholder, textarea::placeholder { color: var(--t3); }
.mono { font-family: var(--mono); }
.dim { color: var(--t3); }
.muted { color: var(--t2); }
.grow { flex: 1; min-width: 0; }
.sp { flex: 1; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg.i { width: 15px; height: 15px; flex: none; display: block; }
kbd { font: 500 11px var(--mono); color: var(--t2); border: 1px solid var(--line-3); border-radius: 4px; padding: 0 5px; background: transparent; }

/* =====================================================================
   Coquille : en-tête (portée + recherche) puis onglets, contenu dessous
   ===================================================================== */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; }
.hdr { min-width: 0; } .hdr-row { overflow: hidden; }
.hdr { border-bottom: 1px solid var(--line-2); background: var(--bg-1); }
.hdr-row { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 24px; min-width: 0; }
.logo { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 7px; background: var(--pri); color: var(--pri-t); display: grid; place-items: center; flex: none; }
.logo svg { width: 13px; height: 13px; }
.slash { color: var(--line-3); font-size: 22px; font-weight: 300; margin: 0 2px; flex: none; }
.scope { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 7px; font-weight: 500; white-space: nowrap; min-width: 0; }
.scope:hover, .scope.open { background: var(--bg-3); }
.scope .orb { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, var(--t1), var(--t3)); flex: none; }
.scope .tld { font: 500 11px var(--mono); color: var(--t2); border: 1px solid var(--line-3); border-radius: 99px; padding: 0 7px; }
.scope .ud { width: 14px; height: 14px; color: var(--t3); }
.scope .nm { overflow: hidden; text-overflow: ellipsis; }
.devtag { font: 600 10px var(--mono); color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); border-radius: 4px; padding: 0 5px; letter-spacing: .04em; }
.searchbtn { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 32px; width: 240px; max-width: 30vw; padding: 0 8px 0 10px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--bg); color: var(--t3); box-sizing: border-box; }
.searchbtn:hover { border-color: var(--line-3); }
.searchbtn span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.issues { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 13px; white-space: nowrap; box-sizing: border-box; }
.issues:hover { background: var(--bg-3); }
.issues i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.issues.bad i { background: var(--red); }
.tabs { display: flex; gap: 2px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { all: unset; cursor: pointer; position: relative; height: 46px; display: inline-flex; align-items: center; padding: 0 2px; color: var(--t2); white-space: nowrap; font-size: 14px; }
.tab > span { padding: 6px 10px; border-radius: 6px; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover > span { background: var(--bg-3); color: var(--t1); }
.tab small { font: 500 11px var(--mono); color: var(--t3); }
.tab small.bad { color: var(--red); }
.tab.on { color: var(--t1); }
.tab.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--t1); }
.main { overflow: auto; min-height: 0; }

/* =====================================================================
   Primitives
   ===================================================================== */
.pg { padding: 40px 32px 64px; display: grid; gap: 24px; align-content: start; }
.pg.cols { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
.pg-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pg-h > div:first-child { display: grid; gap: 6px; min-width: 0; }
h1 { margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -.04em; line-height: 1.15; }
h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
h2.lg { font-size: 20px; letter-spacing: -.02em; }
.lead { margin: 0; color: var(--t2); }
.lead code, .hl { font-family: var(--mono); color: var(--t1); font-size: .95em; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
section.blk { display: grid; gap: 12px; align-content: start; min-width: 0; }
.blk-h { display: flex; align-items: center; gap: 10px; }
.blk-h .lnk { margin-left: auto; font-size: 13px; color: var(--t2); cursor: pointer; }
.blk-h .lnk:hover { color: var(--t1); }

.box { border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg-1); overflow: hidden; min-width: 0; }
.box.pad { padding: 16px; }
.box > .row, .rows > .row { border-top: 1px solid var(--line); margin-top: -1px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-width: 0; }
.row.click { cursor: pointer; } .row.click:hover { background: var(--bg-2); }
.box-h { display: grid; padding: 10px 16px; font-size: 12.5px; color: var(--t2); background: var(--bg); border-bottom: 1px solid var(--line); gap: 16px; }
.box-f { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--bg); font-size: 13px; color: var(--t2); }
.empty { padding: 48px 20px; text-align: center; color: var(--t2); font-size: 13.5px; display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--t1); font-weight: 500; font-size: 14.5px; }
.empty.dash { border: 1px dashed var(--line-2); border-radius: 12px; }
.empty .acts { margin-top: 10px; justify-content: center; }

.b { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--bg-1); font-weight: 500; white-space: nowrap; font-size: 14px; }
.b:hover { background: var(--bg-3); }
.b svg.i { color: var(--t2); }
.b.pri { background: var(--pri); color: var(--pri-t); border-color: var(--pri); }
.b.pri svg.i { color: var(--pri-t); }
.b.pri:hover { background: var(--pri-h); }
.b.on { border-color: var(--blue); color: var(--blue); }
.b.on svg.i { color: var(--blue); }
.b.sm { height: 30px; padding: 0 12px; font-size: 13px; border-radius: 6px; gap: 7px; }
.b.sm svg.i { width: 13px; height: 13px; }
.b.ghost { border-color: transparent; background: transparent; color: var(--t2); }
.b.ghost:hover { color: var(--t1); background: var(--bg-3); }
.b.danger { color: var(--red); } .b.danger svg.i { color: var(--red); }
.b:disabled, .b.off { opacity: .45; pointer-events: none; }
.ib { all: unset; box-sizing: border-box; cursor: pointer; width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--t2); flex: none; }
.ib:hover { background: var(--bg-3); color: var(--t1); }
.ib:disabled { opacity: .35; pointer-events: none; }
.ib.on { color: var(--t1); background: var(--bg-3); }
.link { all: unset; cursor: pointer; font-size: 13px; color: var(--t2); text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--t1); }
.link.mono { font-family: var(--mono); color: var(--t1); }

.field { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-1); color: var(--t3); min-width: 0; }
.field:focus-within { border-color: var(--line-4); }
.field input { all: unset; flex: 1; color: var(--t1); min-width: 0; }
.field.sm { height: 32px; border-radius: 7px; padding: 0 10px; font-size: 13px; }
.inp { height: 36px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--bg); outline: none; min-width: 0; color: var(--t1); }
.inp:focus { border-color: var(--line-4); }
.inp.mono { font: 13px var(--mono); }
textarea.inp { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.6; }
select.inp { padding: 0 8px; }

.seg { display: inline-flex; height: 36px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg-1); padding: 3px; gap: 2px; flex: none; }
.seg.lg { height: 40px; }
.seg.sm { height: 32px; border-radius: 7px; padding: 2px; }
.seg > button, .seg > a { all: unset; cursor: pointer; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: 5px; font-size: 13px; font-weight: 500; color: var(--t3); white-space: nowrap; }
.seg.sm > button { padding: 0 10px; font-size: 12.5px; }
.seg > button:hover, .seg > a:hover { color: var(--t1); }
.seg > .on { color: var(--t1); background: var(--bg-4); }
.seg > button:disabled { opacity: .4; pointer-events: none; }
.seg.icons > button { padding: 0; width: 32px; justify-content: center; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--t4); flex: none; display: inline-block; }
.dot.ok { background: var(--green); } .dot.err { background: var(--red); } .dot.live { background: var(--blue); } .dot.warn { background: var(--amber); }
.dot.ring.err { box-shadow: 0 0 0 3px rgba(240,82,82,.18); } .dot.ring.live { box-shadow: 0 0 0 3px rgba(59,158,255,.18); }
.dot.lg { width: 10px; height: 10px; }
.st { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; white-space: nowrap; }
.st.dimt { color: var(--t2); }
.st.red { color: var(--red); }
.badge { font-size: 11.5px; font-weight: 500; border: 1px solid var(--line-3); border-radius: 99px; padding: 1px 8px; color: var(--t1); white-space: nowrap; }
.badge.mono { font: 500 11px var(--mono); }
.tag { font: 600 11px var(--mono); color: var(--t1); border: 1px solid var(--line-3); padding: 1px 7px; border-radius: 5px; }

.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font: 600 11px/1 var(--font); text-transform: uppercase; flex: none; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.av.xs { width: 18px; height: 18px; font-size: 8.5px; }
.av.sm { width: 20px; height: 20px; font-size: 9px; }
.av.md { width: 30px; height: 30px; font-size: 12px; }
.av.lg { width: 34px; height: 34px; font-size: 13px; }

.sw { all: unset; cursor: pointer; position: relative; width: 36px; height: 20px; border-radius: 99px; flex: none; background: var(--bg-3); border: 1px solid var(--line-3); box-sizing: border-box; }
.sw i { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--t3); transition: transform .15s; }
.sw.on { background: var(--pri); border-color: var(--pri); }
.sw.on i { background: var(--pri-t); transform: translateX(16px); }
.sw.sm { width: 30px; height: 18px; } .sw.sm i { width: 12px; height: 12px; } .sw.sm.on i { transform: translateX(12px); }
.sw:disabled { opacity: .5; pointer-events: none; }
.ck { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-4); display: grid; place-items: center; color: var(--pri-t); flex: none; }
.ck.on { background: var(--pri); border-color: var(--pri); }
.ck svg { width: 11px; height: 11px; }
input[type=checkbox] { accent-color: var(--t1); }

pre.term { margin: 0; padding: 14px 16px; overflow: auto; font: 12.5px/1.75 var(--mono); color: var(--t2); white-space: pre-wrap; word-break: break-word; background: var(--bg); }
pre.term.nowrap { white-space: pre; word-break: normal; }
pre.term .e { color: var(--red); } pre.term .w { color: var(--amber); } pre.term .ok { color: var(--green); } pre.term .run { color: var(--blue); } pre.term .ts { color: var(--t3); }
pre.code { margin: 0; padding: 14px 16px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); font: 12.5px/1.75 var(--mono); color: var(--t2); white-space: pre-wrap; overflow: auto; }
pre.code i { color: var(--t3); font-style: normal; }

/* =====================================================================
   Vue d'ensemble
   ===================================================================== */
.ov-side { flex: 0 0 260px; min-width: 240px; display: grid; gap: 28px; }
.ov-main { flex: 1 1 360px; min-width: 0; display: grid; gap: 16px; align-content: start; }
.kv { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); margin-top: -1px; font-size: 13px; }
.kv .k { color: var(--t2); flex: 1; }
.kv .v { font: 500 12.5px var(--mono); }
.kv .dot { width: 6px; height: 6px; }
.kv.go { all: unset; box-sizing: border-box; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--t2); cursor: pointer; }
.kv.go:hover { background: var(--bg-2); color: var(--t1); }
.alert-c { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg-1); }
.alert-c:hover { border-color: var(--line-4); background: var(--bg-2); }
.alert-c > svg { color: var(--red); margin-top: 2px; }
.alert-c.warn > svg { color: var(--amber); }
.alert-c span { display: grid; gap: 2px; font-size: 13px; min-width: 0; }
.alert-c b { font-weight: 500; }
.alert-c em { font-style: normal; color: var(--t2); overflow: hidden; text-overflow: ellipsis; }
.calm { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg-1); font-size: 13px; color: var(--t2); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar .field { flex: 1; min-width: 200px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { display: grid; gap: 16px; padding: 18px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg-1); cursor: pointer; min-width: 0; align-content: start; }
.card:hover { border-color: var(--line-4); }
.card-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.card-top .nm { display: grid; min-width: 0; flex: 1; line-height: 1.3; }
.card-top .nm b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-top .nm span { font-size: 13px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-ev { display: grid; gap: 4px; font-size: 13px; min-width: 0; }
.card-ev > span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-ev > span svg { color: var(--t2); } .card-ev.bad > span svg { color: var(--red); }
.card-ev .when { color: var(--t3); }
.card-ft { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--t2); min-width: 0; }
.card-ft .p { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.card-ft .r { font-family: var(--mono); color: var(--t3); white-space: nowrap; }
.firsts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.firsts button { all: unset; cursor: pointer; display: grid; gap: 6px; padding: 18px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg-1); }
.firsts button:hover { border-color: var(--line-4); }
.firsts button svg { width: 18px; height: 18px; color: var(--t2); margin-bottom: 6px; }
.firsts b { font-weight: 600; } .firsts span { color: var(--t2); font-size: 13px; }

/* tables « grille » génériques (sites, workers) */
.tbl-x { overflow-x: auto; }
.tr { display: grid; gap: 16px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); margin-top: -1px; cursor: pointer; }
.tr:hover { background: var(--bg-2); }
.tr .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tr .who > span:last-child { display: grid; min-width: 0; line-height: 1.35; }
.tr .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr .who small { font: 12px var(--mono); color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr .m { font: 13px var(--mono); color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr .t { font-size: 13px; color: var(--t2); white-space: nowrap; }
.tr .chev { color: var(--t3); }
.g-sites { grid-template-columns: minmax(220px, 1.4fr) 120px 170px 100px 140px 140px 16px; min-width: 900px; }
.g-wk { grid-template-columns: minmax(150px, 1fr) 150px 160px 90px 110px 16px; min-width: 760px; }

/* =====================================================================
   Site
   ===================================================================== */
.site-hero { display: flex; flex-wrap: wrap; }
.shot { flex: 1 1 340px; min-height: 240px; margin: 16px; border-radius: 8px; border: 1px solid var(--line); background: repeating-linear-gradient(135deg, var(--bg-1) 0 10px, var(--bg-2) 10px 20px); display: grid; place-items: center; gap: 12px; align-content: center; text-align: center; }
.shot .av { width: 56px; height: 56px; font-size: 20px; border-radius: 14px; }
.shot a { font: 500 12px var(--mono); color: var(--t2); background: var(--bg-1); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line-2); }
.shot a:hover { color: var(--t1); border-color: var(--line-4); }
.details { flex: 1.2 1 380px; padding: 24px 24px 24px 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 24px; align-content: start; }
.det { display: grid; gap: 4px; min-width: 0; }
.det > span { font-size: 13px; color: var(--t2); }
.det > b, .det > button { all: unset; display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
.det > button { cursor: pointer; } .det > button:hover .v { text-decoration: underline; text-underline-offset: 3px; }
.det .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.det .v.mono { font-size: 13.5px; }
.det small { color: var(--t3); font-weight: 400; font-size: 12.5px; }
.route { display: grid; grid-template-columns: 80px 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 16px; border-top: 1px solid var(--line); margin-top: -1px; font: 13px var(--mono); }
.route svg { color: var(--t3); }
.route .to { color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route .badge { font-family: var(--font); color: var(--t2); }

/* =====================================================================

/* =====================================================================

.dbbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dbbar .b { height: 32px; font-size: 13px; }

.grid-wrap { overflow: auto; max-height: calc(100vh - 360px); min-height: 160px; }

.note { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: 8px; font-size: 13px; color: var(--t2); }

.fpanel { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg-1); }

.selbar { position: sticky; bottom: 12px; justify-self: center; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 14px; border-radius: 10px; border: 1px solid var(--line-3); background: var(--bg-1); box-shadow: var(--shadow); font-size: 13px; z-index: 5; }

.struct { display: grid; grid-template-columns: minmax(0, 1fr) 200px 90px minmax(0, 1fr) 50px; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); margin-top: -1px; align-items: center; font-size: 13px; }

.sqlbox textarea { display: block; width: 100%; min-height: 180px; resize: vertical; background: var(--bg); color: var(--t1); border: 0; padding: 16px; font: 13px/1.75 var(--mono); outline: none; }

.bk-new { display: flex; align-items: center; gap: 12px; padding: 16px; flex-wrap: wrap; }

.dbstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* =====================================================================
   Dumps, mails, journal, logs
   ===================================================================== */

.dump-h .f span { color: var(--t3); }
.dump-h .s { font-size: 13px; color: var(--t2); white-space: nowrap; }
.dump-h time { font: 12.5px var(--mono); color: var(--t3); white-space: nowrap; }

.mv { flex: 1 1 420px; min-width: 0; display: grid; grid-template-rows: auto 1fr; }

.mv-b pre { margin: 0; font: 13px/1.75 var(--mono); white-space: pre-wrap; color: var(--t2); word-break: break-word; }
.jr-side { flex: 0 1 220px; min-width: 200px; display: grid; gap: 24px; align-content: start; }

.fopt:hover { background: var(--bg-3); }
.fopt.on { color: var(--t1); }
.fopt .n { margin-left: auto; font: 12px var(--mono); color: var(--t3); }
.fopt .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quiet { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-1); font-size: 13.5px; color: var(--t2); white-space: nowrap; }
.quiet:hover { color: var(--t1); }
.hist { display: flex; align-items: flex-end; gap: 3px; height: 64px; }
.hist > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 1px; }

.jr { border-top: 1px solid var(--line); margin-top: -1px; }

.jr-r .chev { color: var(--t3); transition: transform .15s; }

.jr-d { padding: 12px 16px 14px 95px; background: var(--bg); border-top: 1px solid var(--line); display: grid; gap: 10px; }

/* =====================================================================
   Superpositions : popover, palette, dialogue, panneau latéral, toasts

/* =====================================================================

    else if ((x = msg.match(/^\[site:([^:]+):([^\]]+)\] démarrage impossible: (.*)/))) add({ kind: 'worker', ico: 'alert', cls: 'err', html: `Impossible de lancer <b>${esc(x[2])}</b> · ${esc(x[3])}`, site: x[1], key: 'site:' + x[1] + ':' + x[2] });
    else if ((x = msg.match(/^\[site:([^:]+):([^\]]+)\] arrêté proprement/))) add({ kind: 'worker', routine: true, ico: 'stop', cls: 'ok', html: `Worker <b>${esc(x[2])}</b> arrêté`, site: x[1], key: 'site:' + x[1] + ':' + x[2] });
    else if ((x = msg.match(/^\[service:([^\]]+)\] démarré/))) add({ kind: 'service', routine: true, ico: 'play', cls: 'ok', html: `<b>${esc(svcName(x[1]))}</b> démarré`, svc: x[1] });
    else if ((x = msg.match(/^\[service:([^\]]+)\] arrêté proprement/))) add({ kind: 'service', ico: 'stop', cls: 'ok', html: `<b>${esc(svcName(x[1]))}</b> arrêté proprement`, svc: x[1] });
    else if ((x = msg.match(/^\[service:([^\]]+)\] terminé/))) add({ kind: 'service', ico: 'stop', cls: 'err', html: `<b>${esc(svcName(x[1]))}</b> s'est arrêté de lui-même`, svc: x[1] });
    else if ((x = msg.match(/^\[service:([^\]]+)\] démarrage impossible: (.*)/))) add({ kind: 'service', ico: 'alert', cls: 'err', html: `<b>${esc(svcName(x[1]))}</b> ne démarre pas · ${esc(x[2])}`, svc: x[1] });
    else if ((x = msg.match(/^◆ dump reçu(?: : (.*))?$/))) { const s = x[1] && siteOfPath(x[1].replace(/:\d+$/, '')); add({ kind: 'dump', ico: 'bug', cls: 'acc', html: `Dump · <b>${esc(x[1] ? x[1].split(/[\\/]/).slice(-1)[0] : 'reçu')}</b>`, site: s?.name, go: ['debug'], goL: 'Voir le dump' }); }
    else if ((x = msg.match(/^projet (.+) créé$/))) add({ kind: 'project', ico: 'sparkle', cls: 'ok', html: `Projet <b>${esc(x[1])}</b> créé`, site: x[1] });
    else if ((x = msg.match(/^création de (.+?): (.*)$/))) add({ kind: 'project', ico: 'alert', cls: 'err', html: `Création de <b>${esc(x[1])}</b> échouée · ${esc(x[2])}`, go: ['logs', 'create:' + x[1]], goL: 'Voir la sortie' });
    else if ((x = msg.match(/^sauvegarde ([^/]+)\/(\S+) : (.*)$/))) add({ kind: 'db', ico: 'box', cls: 'acc', html: `Sauvegarde <b>${esc(x[3].split(/[\\/]/).pop())}</b> créée`, svc: x[1], go: ['db', x[1], x[2], '', 'backups'], goL: 'Ouvrir les sauvegardes' });
    else if ((x = msg.match(/^base ([^/]+)\/(\S+) restaurée depuis (.*)$/))) add({ kind: 'db', ico: 'restart', cls: 'amber', html: `Base <b>${esc(x[2])}</b> restaurée`, svc: x[1], go: ['db', x[1], x[2]], goL: 'Ouvrir la base' });
    else if (/^Serveur de dumps sur|^SMTP \(capture|^API sur/.test(msg)) continue;

    else if ((x = msg.match(/^\[([^\]]+)\] php-cgi en erreur/))) add({ kind: 'system', ico: 'alert', cls: 'err', html: `php-cgi redémarré`, site: x[1] });

    else if (/^Proxy sur/.test(msg)) add({ kind: 'system', routine: true, ico: 'bolt', cls: 'ok', html: `Proxy démarré sur <b>${esc(msg.replace('Proxy sur ', ''))}</b>` });
    else if (lvl === 'ERROR') add({ kind: 'system', ico: 'alert', cls: 'err', html: esc(msg) });

/* =====================================================================
   Site : aperçu, workers, logs, réglages

let logLevel = 'all';
function pSite(name, tab) {
  const s = siteOf(name);
  if (!s) return set(`<div class="pg"><div class="empty dash"><b>Site introuvable</b><span>« ${esc(name)} » n'existe plus.</span><div class="acts"><a class="b" href="#/sites">Voir les sites</a></div></div></div>`);
  const body = { overview: siteOverview, workers: siteWorkers, logs: siteLogs, settings: siteSettings }[tab] || siteOverview;
  set(`<div class="pg" style="gap:32px">
    <div class="pg-h" style="align-items:center"><div><h1>${esc(s.name)}</h1></div>
      <div class="acts">
        <button class="b" onclick="act('/api/open-terminal',{site:${J(s.name)}})" title="Terminal avec le PHP ${esc(s.php)} et le Node ${esc(s.node)} de ce projet">${ic('term')}Terminal</button>
        <button class="b" onclick="act('/api/open-editor',{path:${J(s.path)}})">${ic('code')}Éditeur</button>
        <button class="b ${shareOn(s) ? 'on' : ''}" onclick="shareMenu(this,${J(s.name)})" title="Adresse publique temporaire (Cloudflare Tunnel)">${ic('share')}${shareOn(s) ? (s.share.url ? 'Partagé' : 'Ouverture…') : 'Partager'}</button>
        <a class="b pri" href="${esc(s.url)}" target="_blank">Visiter</a></div></div>
    ${body(s)}</div>`);
  if (tab === 'logs') loadLaravelLog(s);
}
function siteOverview(s) {
  const st = siteState(s), m = s.metrics, evs = groupEvents(parseEvents().filter(e => e.site === s.name)).slice(0, 10);
  const root = s.proxy ? `proxy :${s.proxy}` : (normPath(s.docroot).replace(normPath(s.path), '').replace(/^\\/, '') || '.') + '\\';
  const det = (k, v, o = {}) => `<div class="det"><span>${k}</span>${o.on ? `<button onclick="${o.on}" title="${esc(o.title || '')}">` : '<b>'}${o.dot ? dot(o.dot) : ''}<span class="v ${o.mono ? 'mono' : ''}">${v}</span>${o.small ? `<small>${o.small}</small>` : ''}${o.on ? '</button>' : '</b>'}</div>`;
  return `<section class="box">
      <div class="site-hero">
        <div class="shot">${avatar(s.name)}<a href="${esc(s.url)}" target="_blank">${esc(s.url.replace(/^https?:\/\//, ''))} ↗</a></div>
        <div class="details">
          ${det('URL', esc(s.url.replace(/^https?:\/\//, '')), { mono: true, on: `copy(${J(s.url)},'URL copiée')`, title: 'Copier' })}
          ${det('Statut', ST[st][0], { dot: ST[st][1] })}
          ${det('Racine', esc(root), { mono: true })}
          ${det('Origine', s.linked ? 'Projet lié' : 'Dossier parqué')}
          ${det('HTTPS', s.secure ? 'Activé' : 'Désactivé', { dot: s.secure ? (S.ca_trusted ? 'ok' : 'warn') : '', small: s.secure && !S.ca_trusted ? 'autorité non approuvée' : '', on: `secureSite(${J(s.name)},${!s.secure})`, title: s.secure ? 'Repasser en HTTP' : 'Servir en HTTPS' })}
          ${s.proxy ? '' : det('Xdebug', s.xdebug ? 'Activé · port 9003' : 'Désactivé', { dot: s.xdebug ? 'ok' : '', on: `saveSite(${J(s.name)},{xdebug:${!s.xdebug}})`, title: s.xdebug ? 'Désactiver Xdebug' : 'Activer Xdebug' })}
          ${shareOn(s) ? det('Partage', s.share.url ? esc(s.share.url.replace(/^https:\/\//, '')) : 'ouverture du tunnel…', { mono: true, dot: s.share.url ? 'live' : 'warn', on: s.share.url ? `copy(${J(s.share.url)},'Adresse publique copiée')` : '', title: 'Copier' }) : ''}
          ${s.proxy ? det('PHP', '—', { mono: true }) : det('PHP', esc(s.php), { mono: true, small: s.php_pinned ? 'isolé' : 'défaut', on: `verMenu(this,'php',${J(s.name)})`, title: 'Changer de version' })}
          ${det('Node.js', esc(s.node), { mono: true, small: s.node_pinned ? 'isolé' : 'défaut', on: `verMenu(this,'node',${J(s.name)})`, title: 'Changer de version' })}
          ${det('Requêtes · 5 min', fmtNum(recent5(s)) + (m.errors ? ` · ${m.errors} erreur${m.errors > 1 ? 's' : ''} au total` : ''), { mono: true })}
          ${det('Dernière requête', m.last_at ? `${m.last_path ? `<span class="mono">${esc((m.last_method || 'GET') + ' ' + m.last_path)}</span> · ` : ''}${m.last_status} · ${m.last_ms} ms` : 'aucune', { small: m.last_at ? ago(m.last_at) : '' })}
          ${m.last_err_at ? det('Dernière erreur', `<span class="mono">${esc(m.last_err_path)}</span> · ${m.last_err_status}`, { dot: 'err', small: ago(m.last_err_at), on: `go('sites',${J(s.name)},'logs')`, title: 'Voir le log Laravel' }) : ''}
        </div></div>
      <div class="box-f">${ic('info')}<span>Isolé : <b style="color:var(--t1);font-weight:500">php-cgi, workers, terminal et <span class="mono">viherd npm</span></b> utilisent les versions de ce projet.</span></div>
    </section>
    <section class="blk"><h2>Routage</h2><div class="box">
      ${s.routes.map(r => `<div class="route"><b style="font-weight:500">${esc(r.path)}</b>${ic('arrow')}<span class="to">127.0.0.1:${r.port}</span><span class="badge">WebSocket</span></div>`).join('')}
      <div class="route"><b style="font-weight:500">/</b>${ic('arrow')}<span class="to">${esc(s.proxy ? '127.0.0.1:' + s.proxy : tilde(s.docroot))}</span><span class="badge">${s.proxy ? 'Proxy Node' : 'PHP · statique'}</span></div></div></section>
    <section class="blk"><div class="blk-h"><h2>Activité</h2><span class="lnk" onclick="JR.src='s:'+${J(s.name)};go('activity','journal')">Tout le journal →</span></div><div class="box">
      ${evs.length ? evs.map(e => evRow(e)).join('') : '<div class="empty">Aucun événement depuis le démarrage.</div>'}</div></section>`;
}

/* ---------- workers du site ---------- */
const PRESETS = [
  { n: 'queue', c: 'php artisan queue:work --tries=3', d: 'Traite les jobs de la file' },
  { n: 'schedule', c: 'php artisan schedule:work', d: 'Lance les tâches planifiées chaque minute' },
  { n: 'horizon', c: 'php artisan horizon', d: 'Tableau de bord des files Redis' },
  { n: 'reverb', c: 'php artisan reverb:start --host=127.0.0.1 --port=8080', d: 'WebSockets (ajoute la route /app)', route: { path: '/app', port: 8080 } },
  { n: 'pulse', c: 'php artisan pulse:check', d: 'Collecte des métriques Pulse' },
  { n: 'vite', c: 'npm run dev', d: 'Serveur Vite avec rechargement à chaud' },
];
function siteWorkers(s) {
  return `<div style="display:grid;gap:12px">
    <div class="box">${s.workers.map(w => `<div class="tr" style="grid-template-columns:minmax(120px,180px) minmax(0,1fr) 170px 16px" onclick="go('workers',${J(w.key)})">
        <b style="font-weight:600" class="ell">${esc(w.name)}</b><span class="m" style="font-size:12.5px">${esc(w.command)}</span>
        <span class="st dimt" style="font-size:13px;${jobBad(w) ? 'color:var(--red)' : ''}">${dot(jobDot(w))}${jobLabel(w)}${w.running && w.since ? ` · <span class="uptime" data-since="${w.since}" data-short="1">${uptime(now() - w.since)}</span>` : ''}</span>
        <span class="chev">${ic('chev')}</span></div>`).join('')}
      ${s.workers.length ? '' : `<div class="empty">Aucun worker pour ce site.<span>Ils tournent en continu avec le PHP et le Node du projet, et redémarrent s'ils plantent.</span></div>`}</div>
    <button class="b" style="justify-self:start" onclick="addWorkerMenu(this,${J(s.name)})">${ic('plus')}Ajouter un worker</button></div>`;
}
function addWorkerMenu(anchor, site) {
  const s = siteOf(site), used = new Set(s.workers.map(w => w.name));
  popover(anchor, { width: 340, search: 'Modèle de worker…', items: [
    { label: s.laravel ? 'Laravel' : 'Modèles' },
    ...PRESETS.filter(p => !used.has(p.n)).map(p => ({ text: p.n, html: `<b style="font-weight:500">${p.n}</b> <span style="color:var(--t3)">— ${esc(p.d)}</span>`, icon: ic(p.n === 'vite' ? 'node' : 'bolt'), run: () => saveWorkers(s, [...s.workers, { name: p.n, command: p.c }], p.route) })),
    { sep: 1 }, { text: 'Commande personnalisée…', icon: ic('term'), run: () => dlgWorker(site) },
  ] });
}
async function saveWorkers(s, workers, route) {
  const patch = { workers: workers.map(w => ({ name: w.name, command: w.command, autorestart: w.autorestart ?? true })) };
  if (route && !s.routes.some(r => r.path === route.path)) patch.routes = [...s.routes, route];
  await act('/api/site/project', { site: s.name, patch }, 'Workers mis à jour', 'Enregistrement…');
}
function removeWorker(site, name) {
  const s = siteOf(site);
  if (!confirm(`Supprimer le worker « ${name} » de ${site} ?`)) return;
  saveWorkers(s, s.workers.filter(w => w.name !== name));
}
function dlgWorker(site) {
  modal(`<div class="m-b"><h3>Nouveau worker · ${esc(site)}</h3><p>Lancé avec le PHP et le Node du projet, et relancé s'il s'arrête.</p>
    <input class="inp mono" id="w-cmd" placeholder="php artisan queue:work --queue=emails">
    <input class="inp" id="w-name" placeholder="Nom (ex : emails)" onkeydown="if(event.key==='Enter')$('m-ok').click()"></div>
    <div class="m-f"><span></span><button class="b ghost" onclick="closeAll()">Annuler</button><button class="b pri" id="m-ok" onclick="const c=$('w-cmd').value.trim(),n=$('w-name').value.trim();if(!c||!n)return toast('Nom et commande requis','err');closeAll();const s=siteOf(${J(site)});saveWorkers(s,[...s.workers,{name:n,command:c}])">Ajouter</button></div>`);
}

/* ---------- logs du site : dumps + log Laravel ---------- */
function siteLogs(s) {
  const ds = (window.DUMPS || []).filter(d => siteOfPath(d.root) === s);
  return `${ds.length ? `<section class="blk"><div class="blk-h"><h2>Dumps</h2><span class="lnk" onclick="go('debug')">Tous les dumps →</span></div><div class="box">${ds.slice(0, 20).map(dumpRow).join('')}</div></section>` : ''}
    <section class="blk"><div class="blk-h"><h2>Log Laravel</h2>
      <span class="seg sm" id="ll-seg" style="margin-left:auto">${[['all', 'Tout'], ['error', 'Erreurs'], ['warning', 'Alertes'], ['info', 'Info'], ['debug', 'Debug']].map(([k, l]) => `<button class="${logLevel === k ? 'on' : ''}" onclick="logLevel='${k}';loadLaravelLog(siteOf(${J(s.name)}))">${l}</button>`).join('')}</span>
      <button class="ib" title="Vider le log" onclick="if(confirm('Vider le fichier de log ?'))act('/api/site/laravel-log/clear',{site:${J(s.name)}},'Log vidé')">${ic('trash')}</button></div>
      <div class="box" id="ll"><div class="empty">Chargement…</div></div></section>`;
}
async function loadLaravelLog(s) {
  const r = await fetch('/api/site/laravel-log?site=' + encodeURIComponent(s.name)).then(r => r.json()).catch(() => ({}));
  const box = $('ll'); if (!box) return;
  document.querySelectorAll('#ll-seg button').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes(`'${logLevel}'`)));
  if (!r.file) { box.innerHTML = `<div class="empty">Pas de <span class="hl">storage/logs/*.log</span> dans ce projet.</div>`; return; }
  const parts = r.text.replace(/^\uFEFF/, '').split(/^(?=\[\d{4}-\d\d-\d\d[ T]\d\d:\d\d:\d\d[^\]]*\] \w+\.\w+:)/m);
  let entries = parts.map(p => { const m = p.match(/^\[([^\]]+)\] (\w+)\.(\w+): ([\s\S]*)$/); return m && { t: m[1], lvl: m[3].toLowerCase(), msg: m[4].trim() }; }).filter(Boolean).reverse();
  const rank = { emergency: 'error', alert: 'error', critical: 'error', error: 'error', warning: 'warning', notice: 'info', info: 'info', debug: 'debug' };
  if (logLevel !== 'all') entries = entries.filter(e => rank[e.lvl] === logLevel);
  const color = l => ({ error: 'var(--red)', warning: 'var(--amber)', info: 'var(--t2)', debug: 'var(--t3)' })[rank[l]] || 'var(--t3)';
  box.innerHTML = `<div class="box-h" style="display:flex;font-family:var(--mono)">${esc(r.file.replace(/\\/g, '/').split('/').slice(-3).join('/'))}<span class="sp"></span><span style="font-family:var(--font);display:inline-flex;gap:6px;align-items:center">${dot('ok')}En direct</span></div>`
    + (entries.length ? entries.slice(0, 120).map((e, i) => { const [first, ...rest] = e.msg.split('\n'); return `<div class="llog ${rank[e.lvl] === 'error' ? 'error' : ''}" onclick="const t=this.querySelector('.trace');if(t)t.hidden=!t.hidden">
        <span class="t">${esc(e.t.slice(11, 19))}</span><span style="color:${color(e.lvl)};text-transform:uppercase">${esc(e.lvl)}</span><span class="m">${esc(first)}${rest.length ? ` <span style="color:var(--t3)">· ${rest.length} ligne${rest.length > 1 ? 's' : ''}</span>` : ''}</span>
        ${rest.length ? `<pre class="term trace" hidden>${esc(rest.join('\n'))}</pre>` : ''}</div>`; }).join('')
      : `<div class="empty">Aucune entrée${logLevel !== 'all' ? ' pour ce niveau' : ''}.</div>`);
}

/* ---------- réglages : un bloc par réglage, chacun avec son bouton ---------- */
const kvRow = (a, b, pa, pb) => `<div class="kvr"><input class="inp mono" style="flex:1" value="${esc(a)}" placeholder="${pa}"><input class="inp mono" style="flex:1.4" value="${esc(b)}" placeholder="${pb}"><button class="ib" onclick="this.parentNode.remove()" title="Retirer">${ic('x')}</button></div>`;
function addKv(id, pa, pb) { const el = $(id); el.insertAdjacentHTML('beforeend', kvRow('', '', pa, pb)); el.lastElementChild.querySelector('input').focus(); }
const setBlock = (title, desc, inner, hint, save) => `<section class="box"><div class="set-in"><h3>${title}</h3><p>${desc}</p>${inner}</div>
  <div class="set-f"><span>${hint}</span>${save ? `<button class="b pri" onclick="${save}">Enregistrer</button>` : ''}</div></section>`;

  return `<div class="setg">
    ${setBlock('Dossier public', "Le dossier servi à la racine du site. <span class='hl'>public/</span> est utilisé par défaut s'il existe.", `<input class="inp mono" id="set-root" value="${esc(s.root || '')}" placeholder="public">`, 'Clé <span class="hl">root</span> dans viherd.toml', `saveSite(${J(s.name)},{root:$('set-root').value.trim()||null})`)}
    ${setBlock('Proxy vers un port', 'Pour une app 100 % Node (Next, Nuxt, Astro…) : tout le site est renvoyé vers ce port au lieu de PHP.', `<input class="inp mono" id="set-proxy" value="${s.proxy || ''}" placeholder="3000">`, 'Vide = PHP · clé <span class="hl">proxy</span>', `saveSite(${J(s.name)},{proxy:parseInt($('set-proxy').value,10)>0?parseInt($('set-proxy').value,10):null})`)}
    ${s.proxy ? '' : setBlock('Version de PHP', 'Utilisée par php-cgi, les workers, le terminal et <span class="hl">viherd php</span>.', `<select class="inp" id="set-php" style="max-width:360px">${opts('php', s.php, s.php_pinned)}</select>`, '<span class="hl">viherd use php &lt;version&gt;</span>', `act('/api/site/php',{site:${J(s.name)},version:$('set-php').value},'PHP mis à jour','Application… (téléchargement si besoin)')`)}
    ${setBlock('Version de Node.js', 'Utilisée par <span class="hl">viherd npm</span>, Vite et les workers Node.', `<select class="inp" id="set-node" style="max-width:360px">${opts('node', s.node, s.node_pinned)}</select>`, '<span class="hl">viherd use node &lt;version&gt;</span>', `act('/api/site/node',{site:${J(s.name)},version:$('set-node').value},'Node mis à jour','Application… (téléchargement si besoin)')`)}
    ${setBlock('HTTPS', `Sert <span class="hl">https://${esc(s.name)}.${esc(S.tld)}</span> avec un certificat signé par l'autorité locale de Viherd ; le HTTP redirige vers HTTPS. Pense à mettre <span class="hl">APP_URL</span> en https dans le .env.`,
      `<div class="st" style="gap:10px">${sw(s.secure, `secureSite(${J(s.name)},${!s.secure})`, s.secure ? 'Repasser en HTTP' : 'Servir en HTTPS')}<span>${s.secure ? 'Activé' : 'Désactivé'}</span>${s.secure && !S.ca_trusted ? `<button class="link" onclick="trustCa()">Approuver l'autorité dans Windows</button>` : ''}</div>`,
      '<span class="hl">viherd secure</span> · <span class="hl">viherd unsecure</span>')}
    ${s.proxy ? '' : setBlock('Xdebug', 'Débogage pas à pas : Xdebug se connecte à ton éditeur sur le port <span class="hl">9003</span> (VS Code : extension PHP Debug, « Listen for Xdebug »). Téléchargé au premier usage.',
      `<div class="st" style="gap:10px">${sw(s.xdebug, `saveSite(${J(s.name)},{xdebug:${!s.xdebug}})`, s.xdebug ? 'Désactiver' : 'Activer')}<span>${s.xdebug ? 'Activé pour PHP, les workers et le terminal' : 'Désactivé'}</span></div>`,
      'Clé <span class="hl">xdebug = true</span> dans viherd.toml')}
    ${s.proxy ? '' : setBlock('Réglages php.ini', 'Propres à ce projet, appliqués après le php.ini de la version de PHP.', `<div class="kvs" id="set-ini">${Object.entries(s.php_ini || {}).map(([k, v]) => kvRow(k, v, 'memory_limit', '1G')).join('')}</div><button class="b sm" style="justify-self:start" onclick="addKv('set-ini','memory_limit','1G')">${ic('plus')}Ajouter un réglage</button>`, 'Section <span class="hl">[php_ini]</span>', `saveSite(${J(s.name)},{php_ini:Object.fromEntries([...document.querySelectorAll('#set-ini .kvr')].map(r=>[...r.querySelectorAll('input')].map(i=>i.value.trim())).filter(([k])=>k))})`)}
    ${setBlock('Routes proxifiées', 'HTTP et WebSocket vers un port local, par exemple <span class="hl">/app → 8080</span> pour Reverb.', `<div class="kvs" id="set-routes">${s.routes.map(r => kvRow(r.path, r.port, '/app', '8080')).join('')}</div><button class="b sm" style="justify-self:start" onclick="addKv('set-routes','/app','8080')">${ic('plus')}Ajouter une route</button>`, 'Section <span class="hl">[[routes]]</span>', `saveSite(${J(s.name)},{routes:[...document.querySelectorAll('#set-routes .kvr')].map(r=>{const[p,q]=r.querySelectorAll('input');return{path:p.value.trim(),port:parseInt(q.value,10)}}).filter(r=>r.path&&r.port)})`)}
    ${setBlock("Variables d'environnement", 'Injectées dans PHP, les workers et le terminal de ce projet.', `<div class="kvs" id="set-env">${Object.entries(s.env || {}).map(([k, v]) => kvRow(k, v, 'APP_DEBUG', 'true')).join('')}</div><button class="b sm" style="justify-self:start" onclick="addKv('set-env','APP_DEBUG','true')">${ic('plus')}Ajouter une variable</button>`, 'Section <span class="hl">[env]</span>', `saveSite(${J(s.name)},{env:Object.fromEntries([...document.querySelectorAll('#set-env .kvr')].map(r=>[...r.querySelectorAll('input')].map(i=>i.value)).filter(([k])=>k.trim()).map(([k,v])=>[k.trim(),v]))})`)}
    <section class="box"><div class="set-in"><h3>Fichiers</h3><p>Le projet et sa configuration Viherd.</p></div>
      <div class="set-f"><span class="mono" style="font-size:12.5px">${esc(tilde(s.path))}</span><button class="b sm" onclick="act('/api/open',{path:${J(s.path)}})">${ic('folder')}Dossier</button><button class="b sm" onclick="act('/api/open-editor',{path:${J(s.path + '\\viherd.toml')}})">${ic('code')}viherd.toml</button></div></section>
    ${s.linked ? `<section class="box danger"><div class="set-in"><h3>Délier le site</h3><p>Viherd arrête de servir <span class="hl">${esc(s.name)}.${esc(S.tld)}</span>. Le dossier n'est pas supprimé.</p></div>

/* ---------- éditeur SQL ---------- */
let sqlHist = []; try { sqlHist = JSON.parse(localStorage.getItem('sqlHist') || '[]'); } catch {}
function dbSql() {
  const t = firstTable(), q = n => DB.svc === 'mysql' ? '`' + n + '`' : '"' + n + '"';
  const snips = t ? [['Aperçu', `SELECT * FROM ${q(t)} LIMIT 100;`], ['Compter', `SELECT COUNT(*) FROM ${q(t)};`], ['Tables', DB.svc === 'mysql' ? 'SHOW TABLES;' : "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public';"]] : [];
  $('db-body').innerHTML = `<div class="box sqlbox">
      <textarea id="sqlin" spellcheck="false" placeholder="SELECT * FROM users WHERE …">${esc(DB.sqlText ?? (t ? `SELECT * FROM ${q(t)} LIMIT 100;` : ''))}</textarea>
      <div class="box-f"><span class="sqlinfo" id="sqlinfo"></span><span class="sp"></span>
        ${snips.map(([l, s]) => `<button class="snip" onclick="DB.sqlText=${J(s)};$('sqlin').value=DB.sqlText">${l}</button>`).join('')}
        ${sqlHist.length ? `<button class="snip" onclick="sqlHistMenu(this)">Historique</button>` : ''}
        <kbd>Ctrl ⏎</kbd><button class="b sm pri" onclick="dbRun()">Exécuter</button></div></div>
    <div id="sqlres"></div>`;
  const ta = $('sqlin'); ta.oninput = () => DB.sqlText = ta.value;
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); dbRun(); } if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); } };
  if (DB.result) drawResult();
}
async function dbRun() {
  const sql = $('sqlin').value.trim(); if (!sql) return;
  if ((/^\s*(drop|truncate)\b/im.test(sql) || /\bdelete\s+from\b(?![\s\S]*\bwhere\b)/i.test(sql)) && !confirm('Cette requête supprime des données (DROP / TRUNCATE / DELETE sans WHERE). Continuer ?')) return;
  $('sqlinfo').style.color = 'var(--t2)'; $('sqlinfo').textContent = 'Exécution…';
  try {
    DB.result = await apiPost('/api/db/query', dbQ({ sql }));
    sqlHist = [sql, ...sqlHist.filter(x => x !== sql)].slice(0, 20); try { localStorage.setItem('sqlHist', JSON.stringify(sqlHist)); } catch {}
    if (!DB.result.columns.length) { DB.tables = await apiGet('/api/db/tables', dbQ()); drawPills(); }
  } catch (e) { DB.result = { error: e.message }; }
  drawResult();
}
function drawResult() {
  const r = DB.result, box = $('sqlres'), info = $('sqlinfo'); if (!box) return;
  if (r.error) { info.textContent = ''; box.innerHTML = `<div class="note err">${esc(r.error)}</div>`; return; }
  info.style.color = ''; info.textContent = r.columns.length ? `${fmtNum(r.rows.length)} ligne${r.rows.length > 1 ? 's' : ''}${r.truncated ? ' (limité à 5 000)' : ''} · ${r.ms} ms` : `${r.affected} ligne${r.affected > 1 ? 's' : ''} modifiée${r.affected > 1 ? 's' : ''} · ${r.ms} ms`;
  box.innerHTML = r.columns.length ? `<div class="box"><div class="grid-wrap"><table class="grid"><thead><tr>${r.columns.map(c => `<th style="cursor:default">${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${r.rows.map(row => `<tr>${row.map(v => `<td class="${v != null && /^-?\d+(\.\d+)?$/.test(v) ? 'k-num' : ''}">${cellHTML(v, 'text')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="box-f"><span class="sp"></span><button class="link" onclick="saveCsv(DB.db+'-requete.csv',DB.result.columns,DB.result.rows)">Exporter en CSV</button></div></div>`
    : `<div class="calm">${dot('ok')}Requête exécutée · ${r.affected} ligne(s) modifiée(s).</div>`;
}
function sqlHistMenu(a) { popover(a, { width: 440, search: 'Rechercher…', items: sqlHist.map(q => ({ text: q, html: `<span class="mono" style="font-size:12px">${esc(q.replace(/\s+/g, ' '))}</span>`, run: () => { DB.sqlText = q; $('sqlin').value = q; } })) }); }

/* =====================================================================
   Popovers (menus avec recherche)
   ===================================================================== */
let popEl = null;
function closePop() { popEl?._onClose?.(); popEl?.remove(); popEl = null; }
function popover(anchor, { items, search, onPick, width, up, onClose }) {
  closePop();
  const r = anchor.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'pop'; if (width) el.style.minWidth = width + 'px';
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - (width || 240) - 12)) + 'px'; el.style.top = (r.bottom + 6) + 'px';
  let idx = Math.max(0, items.filter(i => !i.sep && !i.label).findIndex(i => i.checked)), list = items;
  const draw = () => {
    const sel = list.filter(i => !i.sep && !i.label);
    el.querySelector('.items').innerHTML = list.map(i => i.sep ? '<div class="sep"></div>' : i.label ? `<div class="lbl">${esc(i.label)}</div>` : `<div class="o ${sel.indexOf(i) === idx ? 'on' : ''}" data-k="${sel.indexOf(i)}">${i.icon || ''}<span>${i.html || esc(i.text)}</span>${i.checked ? ic('check', 'i ckm', 2.2) : i.hint ? `<small>${esc(i.hint)}</small>` : ''}</div>`).join('') || '<div class="o" style="color:var(--t3)">Aucun résultat</div>';
    el.querySelectorAll('.o[data-k]').forEach(o => { o.onmousemove = () => { if (idx !== +o.dataset.k) { idx = +o.dataset.k; draw(); } }; o.onclick = () => pick(sel[+o.dataset.k]); });
  };
  const pick = i => { if (!i) return; closePop(); (i.run || onPick)(i); };
  el.innerHTML = (search ? `<input placeholder="${esc(search)}">` : '') + '<div class="items"></div>';
  document.body.appendChild(el); popEl = el; draw(); el._onClose = onClose;
  if (up || r.bottom + 6 + el.offsetHeight > innerHeight - 8) el.style.top = Math.max(8, r.top - el.offsetHeight - 6) + 'px';
  const inp = el.querySelector('input');
  const keys = e => {
    const sel = list.filter(i => !i.sep && !i.label);
    if (e.key === 'ArrowDown') { idx = (idx + 1) % sel.length; draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = (idx - 1 + sel.length) % sel.length; draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { pick(sel[idx]); e.preventDefault(); }
    else if (e.key === 'Escape') closePop();
  };
  if (inp) { inp.focus(); inp.oninput = () => { const t = inp.value.toLowerCase(); list = items.filter(i => i.sep || i.label ? !t : (i.text || '').toLowerCase().includes(t)); idx = 0; draw(); }; inp.onkeydown = keys; }
  else { el.tabIndex = -1; el.focus(); el.onkeydown = keys; }
  setTimeout(() => document.addEventListener('mousedown', function h(e) { if (!el.contains(e.target)) { closePop(); document.removeEventListener('mousedown', h); } }), 0);
}
function verMenu(anchor, kind, site) {
  const s = siteOf(site), list = S.installed[kind], def = kind === 'php' ? S.default_php : S.default_node, cur = kind === 'php' ? s.php : s.node, pinned = kind === 'php' ? s.php_pinned : s.node_pinned;
  const sugg = kind === 'php' ? ['8.4', '8.3', '8.2', '8.1'] : ['24', '22', '20', '18'];
  popover(anchor, {
    search: `Version de ${kind === 'php' ? 'PHP' : 'Node'}…`, width: 240,
    items: [{ text: `Par défaut (${def})`, v: '', checked: !pinned }, { label: 'Installées' }, ...list.map(v => ({ text: v, v, checked: pinned && v === cur })),
      ...(sugg.some(v => !list.includes(v)) ? [{ label: 'À télécharger' }, ...sugg.filter(v => !list.includes(v)).map(v => ({ text: v, v, hint: 'télécharger', icon: ic('dl') }))] : [])],
    onPick: i => act('/api/site/' + kind, { site, version: i.v }, `${site} → ${kind === 'php' ? 'PHP' : 'Node'} ${i.v || 'par défaut'}`, 'Application… (téléchargement si besoin)'),
  });
}

/* =====================================================================
   Palette Ctrl K : pages, sites, workers et commandes
   ===================================================================== */
let pal = [], palIdx = 0;
function openPal() {
  closePop(); $('pal').classList.add('open'); $('veil').classList.add('open'); $('pal-in').value = ''; palIdx = 0; palDraw(); $('pal-in').focus();
}
function palItems() {
  const t = $('pal-in').value.trim().toLowerCase(), m = x => !t || x.toLowerCase().includes(t), out = [];
  const [r, a] = route(), cur = r === 'sites' && a ? siteOf(a) : null;
  if (cur) [['Visiter le site', 'ext', () => window.open(cur.url)], ['Ouvrir un terminal isolé', 'term', () => act('/api/open-terminal', { site: cur.name })], ["Ouvrir dans l'éditeur", 'code', () => act('/api/open-editor', { path: cur.path })],
    ['Changer la version de PHP…', 'php', () => setTimeout(() => verMenu($('hdr'), 'php', cur.name), 30)], ['Changer la version de Node…', 'node', () => setTimeout(() => verMenu($('hdr'), 'node', cur.name), 30)],
    ['Ajouter un worker…', 'bolt', () => dlgWorker(cur.name)], ["Copier l'URL", 'link', () => copy(cur.url, 'URL copiée')]].forEach(([l, i, run]) => out.push({ g: cur.name, l, icon: ic(i), run }));
  [["Vue d'ensemble", 'grid', 'activity'], ['Sites', 'globe', 'sites'], ['Workers', 'bolt', 'workers'], ['Bases de données', 'db', 'db'], ['Services', 'layers', 'services'], ['Runtimes', 'php', 'runtimes'], ['Dumps', 'bug', 'debug'], ['Mails', 'inbox', 'mail'], ['Journal', 'logs', 'activity/journal'], ['Logs bruts', 'term', 'logs']]
    .forEach(([l, i, p]) => out.push({ g: 'Pages', l, sub: 'Page', icon: ic(i), run: () => go(...p.split('/')) }));
  S.sites.forEach(s => out.push({ g: 'Sites', l: s.name, sub: s.url.replace(/^https?:\/\//, ''), icon: avatar(s.name, 'xs'), run: () => go('sites', s.name) }));
  allWorkers().forEach(w => out.push({ g: 'Workers', l: `${w.site.name} · ${w.name}`, sub: jobLabel(w), icon: ic('bolt'), run: () => go('workers', w.key) }));
  (DB.dbsBy.mysql || []).concat().forEach(d => out.push({ g: 'Bases', l: d, sub: 'MySQL', icon: ic('db'), run: () => go('db', 'mysql', d) }));
  (DB.dbsBy.postgres || []).forEach(d => out.push({ g: 'Bases', l: d, sub: 'PostgreSQL', icon: ic('db'), run: () => go('db', 'postgres', d) }));
  [['Nouveau projet…', 'sparkle', dlgNew], ['Parquer un dossier…', 'folder', dlgPark], ['Lier un projet…', 'link', dlgLink], ['Installer une version de PHP ou Node…', 'dl', dlgInstall],
   [S.dumps_enabled ? 'Ne plus intercepter les dumps' : 'Intercepter les dumps', 'bug', () => act('/api/settings', { dumps: !S.dumps_enabled }, 'Réglage appliqué')], ['Effacer les dumps', 'trash', () => act('/api/dumps/clear', {}, 'Dumps effacés')],
   ...S.services.map(s => [`${s.enabled ? 'Arrêter' : 'Démarrer'} ${svcName(s.name)}`, s.enabled ? 'stop' : 'play', () => toggleSvc(s.name, !s.enabled)]),
   ['Tout redémarrer (workers)', 'restart', () => workersAll('restart')], ['Recharger la configuration', 'refresh', () => act('/api/reload', {}, 'Configuration rechargée')], ['Mettre à jour le fichier hosts', 'shield', () => act('/api/hosts', {}, r => r.count + ' site(s) écrits')],
   ['Changer de thème', 'sun', toggleTheme]].forEach(([l, i, run]) => out.push({ g: 'Commandes', l, icon: ic(i), run }));
  return out.filter(o => m(o.l) || (o.sub && m(o.sub)));
}
function palDraw() {
  pal = palItems(); palIdx = Math.min(palIdx, Math.max(0, pal.length - 1)); let g = '';
  $('pal-res').innerHTML = pal.map((c, i) => (c.g !== g ? `<div class="lbl">${esc(g = c.g)}</div>` : '') + `<div class="o ${i === palIdx ? 'on' : ''}" data-i="${i}">${c.icon}<span>${esc(c.l)}</span>${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</div>`).join('') || '<div class="lbl">Aucun résultat</div>';
  $('pal-res').querySelectorAll('.o').forEach(o => { o.onmousemove = () => { if (palIdx !== +o.dataset.i) { palIdx = +o.dataset.i; palDraw(); } }; o.onclick = () => palRun(+o.dataset.i); });
  $('pal-res').querySelector('.o.on')?.scrollIntoView({ block: 'nearest' });
}
function palRun(i) { const c = pal[i]; if (!c) return; closeAll(); c.run(); }
$('pal-in').oninput = () => { palIdx = 0; palDraw(); };

  if (e.key === 'ArrowDown') { palIdx = (palIdx + 1) % pal.length; palDraw(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { palIdx = (palIdx - 1 + pal.length) % pal.length; palDraw(); e.preventDefault(); }

/* =====================================================================
   Clavier : Ctrl K, G puis lettre, /, N, A, Shift T, J/K entre sites
   ===================================================================== */
let gPending = 0;
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return $('pal').classList.contains('open') ? closeAll() : openPal(); }
  if (e.key === 'Escape') { if (popEl || $('veil').classList.contains('open')) return closeAll(); }
  if (popEl || $('veil').classList.contains('open') || /input|textarea|select/i.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey || !S) return;
  const k = e.key.toLowerCase();
  if (gPending && Date.now() - gPending < 900) { gPending = 0; const to = { a: ['activity'], s: ['sites'], w: ['workers'], b: ['db'], d: ['services'], r: ['runtimes'], x: ['debug'], m: ['mail'], j: ['activity', 'journal'], l: ['logs'] }[k]; if (to) go(...to); return; }
  if (k === 'g') { gPending = Date.now(); return; }
  if (e.key === 'T' && e.shiftKey) return toggleTheme();
  if (e.key === '/') { const f = $('jr-q') || $('site-q') || $('sites-q'); if (f) { e.preventDefault(); f.focus(); } return; }
  if (k === 'a') return dlgPark();
  if (k === 'n') return dlgNew();
  const [r, a, t] = route();
  if (r === 'sites' && a && (k === 'j' || k === 'k')) { const i = S.sites.findIndex(s => s.name === a), s = S.sites[(i + (k === 'j' ? 1 : -1) + S.sites.length) % S.sites.length]; if (s) go('sites', s.name, t || 'overview'); }
  if (r === 'sites' && a && k === 'o') window.open(siteOf(a)?.url);
});
const applyTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {} };

try { applyTheme(localStorage.getItem('theme') || 'dark'); } catch {}

/* =====================================================================
   Boucle de rafraîchissement
   ===================================================================== */
let sig = '';
async function refresh(force) {
  try {
    const [st, lg, dp] = await Promise.all([fetch('/api/state').then(r => r.json()), fetch('/api/logs?key=daemon').then(r => r.json()).catch(() => ({ log: '' })), fetch('/api/dumps').then(r => r.json()).catch(() => [])]);
    const first = !S; S = st; LOG = (lg.log || '').split('\n'); window.DUMPS = dp;
    const s = JSON.stringify({ ...S, uptime: 0, sites: S.sites.map(x => ({ ...x, metrics: { ...x.metrics, recent: 0, last_ms: 0 } })), log: LOG.length, d: dp.length });
    const busy = popEl || $('veil').classList.contains('open') || /input|select|textarea/i.test(document.activeElement?.tagName);
    const [r, a] = route();
    if (first) { sig = s; render(); return; }
    if (!busy) renderHeader();
    if ($('sheet').classList.contains('open')) { if (s !== sig && sheetSvc) { sig = s; drawSheet(); } }
    else if (r === 'activity' && a === 'journal' && !force) { sig = s; journalTick(); }
    else if (r === 'db' && !force) { sig = s; }
    else if (r === 'mail' && !force) { if (s !== sig) { sig = s; if (!busy) loadMails(); } }
    else if (force || (s !== sig && !busy)) { sig = s; const keep = $('main').scrollTop; render(); $('main').scrollTop = keep; }
  } catch {
    if (!S) {
      $('hdr').innerHTML = `<div class="hdr-row"><span class="logo">${LOGO}</span><span class="slash">/</span><span class="scope"><span class="orb"></span>Machine locale</span><span class="sp"></span><span class="issues bad"><i></i><span>Démon injoignable</span></span></div>`;
      set(`<div class="offline"><b>Le démon ne répond pas</b><span>Lance <span class="hl">viherd start</span> ou l'application. Reconnexion automatique.</span></div>`);
    } else { const p = document.querySelector('.issues'); if (p) { p.classList.add('bad'); p.querySelector('span').textContent = 'Démon injoignable'; } }
  }
}
refresh(); setInterval(refresh, 2500);

/* Mode dev (VIHERD_DEV=1, lancé par dev.ps1) : rechargement automatique quand src/ui.html change.
   La route (#/…) est conservée, donc on reste sur la même page. */

  try {
    const d = await fetch('/api/dev').then(r => r.json());

    setInterval(async () => { try { const x = await fetch('/api/dev').then(r => r.json()); if (x.stamp && x.stamp !== stamp) location.reload(); } catch {} }, 500);
  } catch {}
})();
