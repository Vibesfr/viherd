name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked --bin viherd --bin viherd-app
      - name: Installeur
        run: cargo build --release --locked -p viherd-setup
      - uses: actions/upload-artifact@v4
        with:
          name: viherd-setup
          path: target/release/viherd-setup.exe
