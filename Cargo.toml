[package]
name = "viherd"
version = "0.2.1"
edition = "2021"
description = "Environnement de dev local PHP/Node à la Laravel Herd, écrit en Rust"

[lib]
path = "src/lib.rs"

[[bin]]
name = "viherd"
path = "src/main.rs"

[[bin]]
name = "viherd-app"
path = "src/app.rs"

[dependencies]
tao = "0.37"
tray-icon = "0.26"
wry = "0.57"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal"] }
tokio-postgres = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
zip = "2"
rfd = { version = "0.17.2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# L'installeur embarque les binaires release : il se construit à part (build-installer.ps1)
[workspace]
members = [".", "installer"]
default-members = ["."]
